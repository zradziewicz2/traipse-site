    <script>
        var map = L.map('map').setView([39.7392, -104.9903], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        var userLocation = null;
        
        var allMarkers = [];
        var siteData = [];

function getUserLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            position => {
                userLocation = {
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                };
                console.log("User location retrieved:", userLocation);
                loadLocations(); // Load locations after getting user location
            },
            error => {
                console.error("Error getting location:", error);
                loadLocations(); // Proceed even if location is not available
            }
        );
    } else {
        console.warn("Geolocation is not supported by this browser.");
        loadLocations();
    }
}

function getDistance(lat1, lon1, lat2, lon2) {
    const R = 3958.8; // Radius of Earth in miles
    const toRad = angle => angle * (Math.PI / 180);

    let dLat = toRad(lat2 - lat1);
    let dLon = toRad(lon2 - lon1);

    let a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);

    let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}
        
// Existing function
function loadLocations() {
    fetch('locations.json')
        .then(response => response.json())
        .then(data => {
            siteData = data;
            applyFilters();
        })
        .catch(error => console.error("Error loading JSON:", error));
}
function translateEstimatedTime(time) {
    if (!time) return "Unknown"; // Handle missing values
    const timeMap = {
        "<15 minutes": "Less than 15 minutes",
        "15-1 hour": "15 minutes to 1 hour",
        "1-2 hours": "1-2 hours",
        "more than 2 hours": "More than 2 hours"
    };
    return timeMap[time] || time; // Return formatted value or original if not found
}

        function translateReservations(reservation) {
            if (!reservation) return "Unknown"; 
            const reservationMap = {
                "walkins_welcome": "Walk-Ins Welcome",
                "reservationrequired": "Reservation Required"
            };
            return reservationMap[reservation] || reservation;
        }
function translateTransit(transit) {
    if (!transit) return "Unknown"; // Handle missing values
    const transitMap = {
        "underhalfamilefromtransit": "Under Half Mile from Transit",
        "halfamiletotenmilesfromtransit": "Half Mile to 10 Miles from Transit",
        "overtenmilesfromtransit": "Over 10 Miles from Transit"
    };
    return transitMap[transit.toLowerCase()] || transit; // Return formatted value or original if not found
}

function translateReservations(reservation) {
    if (!reservation) return "Unknown"; // Handle missing values
    const reservationMap = {
        "walkins_welcome": "Walk-Ins Welcome",
        "reservationrequired": "Reservation Required"
    };
    return reservationMap[reservation] || reservation; // Return formatted value or original if not found
}
function translateTours(tours) {
    if (!tours || !Array.isArray(tours)) return "Unknown"; // Handle missing or incorrect values
    const tourMap = {
        "selftours": "Self-Guided Tours",
        "guidedtours": "Guided Tours"
    };
    return tours.map(tour => tourMap[tour.toLowerCase()] || formatText(tour)).join(", ");
}


function applyFilters() {
    let selectedCost = document.getElementById("costFilter").value;
    let selectedType = document.getElementById("typeFilter").value;
    let selectedFamily = document.getElementById("familyFilter").value;
    let selectedLocalOrNational = document.getElementById("localOrNationalFilter") 
    ? document.getElementById("localOrNationalFilter").value 
    : "all";
    let selectedThematicCategory = document.getElementById("ThematicCategoryFilter").value;
    let selectedCity = document.getElementById("cityFilter").value.toLowerCase(); // Get selected city
    let selectedDistance = document.getElementById("distanceFilter").value;
    let selectedEstimatedTime = document.getElementById("estimatedTimeFilter").value;
    let selectedReservations = document.getElementById("reservationsFilter").value;
    let selectedTours = document.getElementById("toursFilter").value;
    let selectedTransit = document.getElementById("transitFilter").value;
    

    // Get selected time periods (array of checked values)
    let selectedTimePeriods = Array.from(document.querySelectorAll(".timePeriodFilter:checked")).map(cb => cb.value);

    let resultsContainer = document.getElementById("searchResults");
    resultsContainer.innerHTML = "";
    allMarkers.forEach(marker => map.removeLayer(marker));
    allMarkers = [];

    siteData.forEach(site => {
        let distance = userLocation ? getDistance(userLocation.lat, userLocation.lng, site.lat, site.lng) : null;

        // Check if site has at least one of the selected time periods
        let matchesTimePeriod = selectedTimePeriods.length === 0 || 
            site.timeperiod.some(period => selectedTimePeriods.includes(period));

        let matchesCity = (selectedCity === "all" || site.city.toLowerCase() === selectedCity);
        
        if (matchesCity && // Apply city filter
            (selectedCost === "all" || site.cost.toLowerCase() === selectedCost) &&
            (selectedType === "all" || site.type.toLowerCase() === selectedType) &&
            (selectedFamily === "all" || String(site.family_friendly).toLowerCase() === selectedFamily) &&
            (selectedThematicCategory === "all" || site.thematiccategory.toLowerCase() === selectedThematicCategory) &&
            (selectedLocalOrNational === "all" || site.localornational.toLowerCase() === selectedLocalOrNational) &&
            (selectedEstimatedTime === "all" || site.estimatedtime.toLowerCase() === selectedEstimatedTime) &&
            (selectedReservations === "all" || site.reservations.toLowerCase() === selectedReservations) &&
            (selectedTours === "all" || site.tours.includes(selectedTours)) &&
            (selectedTransit === "all" || site.transit.toLowerCase() === selectedTransit) &&
            (selectedDistance === "all" || 
             (distance !== null &&
              ((selectedDistance === "1" && distance < 1) ||
               (selectedDistance === "5" && distance >= 1 && distance <= 5) ||
               (selectedDistance === "10" && distance > 10)))) &&
            matchesTimePeriod) {
        
                

            let marker = L.marker([site.lat, site.lng]).bindPopup(`<b>${site.name}</b><br>${site.description}`);
            marker.addTo(map);
            allMarkers.push(marker);

            let siteCard = document.createElement("div");
            siteCard.className = "site-card";
            siteCard.style.display = "flex";  
            siteCard.style.flexDirection = "column";  
            siteCard.style.alignItems = "center"; // Center items in the card

            siteCard.innerHTML = `
            <div class="site-content">
                <div class="site-image-container">
                    <img src="${site.image}" alt="${site.name}" class="site-image">
                </div>
                <div class="site-details">
                    <h3 class="site-title">${site.name}</h3>
                    <p><strong>Time Period:</strong> ${translateTimePeriod(site.timeperiod)}</p>
                    <p><strong>Category:</strong> ${translateCategory(site.thematiccategory)}</p>
                    <p class="site-attributes">
                        ${translateCost(site.cost)}, ${translateType(site.type)}, ${translateLocalOrNational(site.localornational)}, 
                        ${translateEstimatedTime(site.estimatedtime)}, ${translateReservations(site.reservations)}, 
                        ${translateTours(site.tours)}, ${translateTransit(site.transit)}
                    </p>
                    <p class="site-distance"><strong>Distance:</strong> ${userLocation ? distance.toFixed(1) + " miles" : "Unknown"}</p>
                </div>
            </div>
        
            <p class="site-description">${site.description}</p>
        
            <!-- Centered Icons Below the Description -->
            <div class="site-actions">
                <span id="star-${site.id}" class="star-icon" data-tooltip="Add to My Places" 
                      onclick="toggleMyPlaces('${site.id}', this)">☆</span>
                <span id="x-${site.id}" class="x-icon" data-tooltip="Not for me" 
                      onclick="toggleNotInterested('${site.id}', this)">✖</span>
            </div>
        `;
            
            // Function to translate category names to their proper display format
            function translateCategory(category) {
                const categoryMap = {
                    "artsandculture": "Arts and Culture",
                    "foodanddrink": "Food and Drink",
                    "generalhistory": "General History",
                    "historichomes": "Historic Homes",
                    "naturalhistory": "Natural History",
                    "religiousandspiritual": "Religious and Spiritual",
                    "technologyandtransportation": "Technology and Transportation",
                    "other": "Other"
                };
                return categoryMap[category.toLowerCase()] || formatText(category);
            }
            
            // Function to translate time periods
            function translateTimePeriod(timeperiod) {
                const timePeriodMap = {
                    "prehistoric": "Prehistoric",
                    "indigenous": "Indigenous & Native History",
                    "colonial": "Colonial & Early Settlements",
                    "nineteenthcentury": "19th Century - Civil War & Westward Expansion",
                    "industrialrevolution": "20th Century - Industrial Revolution, World Wars",
                    "modernhistory": "Modern History or Civil Rights",
                    "other": "Other"
                };
                return Array.isArray(timeperiod) ? timeperiod.map(tp => timePeriodMap[tp.toLowerCase()] || formatText(tp)).join(", ") : timePeriodMap[timeperiod.toLowerCase()] || formatText(timeperiod);
            }
            
            // Function to properly format cost
            function translateCost(cost) {
                return cost.charAt(0).toUpperCase() + cost.slice(1);
            }
            
            // Function to properly format type
            function translateType(type) {
                return type.charAt(0).toUpperCase() + type.slice(1);
            }
            
            function translateLocalOrNational(value) {
                if (!value) return "Unknown";  // Prevents error if value is undefined or null
                return value.charAt(0).toUpperCase() + value.slice(1);
            }

            
            // Generic function to add spaces between camelCase words & capitalize
            function formatText(text) {
                return text.replace(/([a-z])([A-Z])/g, "$1 $2").replace(/\b[a-z]/g, char => char.toUpperCase());
            }

            
            // Function to format text properly (capitalize and add spaces)
            function formatText(text) {
                return text.replace(/([a-z])([A-Z])/g, "$1 $2") // Adds space between camelCase words
                           .replace(/\b[a-z]/g, char => char.toUpperCase()); // Capitalizes first letter
            }




            siteCard.onclick = () => {
                map.setView([site.lat, site.lng], 14);
                marker.openPopup();
            };
            resultsContainer.appendChild(siteCard);
        }
    });
}

        
        
                    window.onload = function() {
                        getUserLocation(); // Gets user's location when the page loads
                    };
        
            function toggleAdditionalFilters() {
                var filters = document.getElementById("additionalFilters");
                if (filters.style.display === "none" || filters.style.display === "") {
                    filters.style.display = "block";
                } else {
                    filters.style.display = "none";
                }
            }
                // Store user preferences in sets
// Store user preferences in sets
        let myPlaces = new Set();
        let notInterested = new Set();
        
        function toggleMyPlaces(siteId, element) {
            if (myPlaces.has(siteId)) {
                myPlaces.delete(siteId);
                element.textContent = "☆"; // Change back to no fill
                element.classList.remove("active");
            } else {
                myPlaces.add(siteId);
                element.textContent = "⭐"; // Change to filled star
                element.classList.add("active");
        
                // If marked "Not Interested" before, remove it
                if (notInterested.has(siteId)) {
                    notInterested.delete(siteId);
                    let xIcon = document.getElementById(`x-${siteId}`);
                    xIcon.textContent = "✖"; // Change X back to outline
                    xIcon.classList.remove("active");
                }
            }
        }
        
        function toggleNotInterested(siteId, element) {
            if (notInterested.has(siteId)) {
                notInterested.delete(siteId);
                element.textContent = "✖"; // Change back to outline
                element.classList.remove("active");
            } else {
                notInterested.add(siteId);
                element.textContent = "❌"; // Change to filled X
                element.classList.add("active");
        
                // If marked "My Places" before, remove it
                if (myPlaces.has(siteId)) {
                    myPlaces.delete(siteId);
                    let starIcon = document.getElementById(`star-${siteId}`);
                    starIcon.textContent = "☆"; // Change star back to outline
                    starIcon.classList.remove("active");
                }
            }
        }
