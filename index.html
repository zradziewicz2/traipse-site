<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traipse - Discover History Around You</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>

    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #000000;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: #111;
            color: #03FDFC;
        }

        #logo {
            width: 80px;
        }

        .tagline {
            flex-grow: 1;
            text-align: center;
            font-size: 1.2em;
            font-style: italic;
            color: #03FDFC;
        }

        .title-container {
            font-size: 2.5em; /* Slightly bigger */
            font-weight: 900; /* Maximum boldness */
            letter-spacing: 2px; /* Makes it stand out more */
            text-transform: uppercase; /* Ensures it's always capitalized */
            margin-left: auto;
        }

        /* Main Layout */
        .container {
            display: flex;
            flex-direction: row;
            height: calc(100vh - 80px);
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: #181818;
            padding: 15px;
            color: white;
            overflow-y: auto;
        }

        .sidebar h2 {
            color: #03FDFC;
            font-size: 1.2em;
        }
        
                 .filter-group {
                    margin-bottom: 15px;
                }
        
        .timePeriod-group {
            font-size: 0.9em;
            display: flex;
            flex-direction: column;
            gap: 5px; /* Keeps the spacing consistent */
        }
        
        .timePeriod-group label {
            display: flex;
            align-items: center; /* Keeps checkbox and text on the same line */
            gap: 8px; /* Adjusts spacing between checkbox and text */
            font-family: Arial, sans-serif;
        }
        
        .timePeriod-years {
            font-size: 0.8em;
            color: #A0A0A0; /* Subtle gray for the year */
            margin-left: 30px; /* Aligns the years with the text */
            display: block; /* Forces the year to appear below */
        }


        
        .filter-group select {
            width: 100%;
            padding: 8px;
            font-size: 1em;
            border-radius: 5px;
            border: none;
        }


        button {
            background-color: #03FDFC;
            color: #000;
            border: none;
            padding: 10px;
            font-size: 1em;
            width: 100%;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
        }

        button:hover {
            background-color: #02c9c9;
        }

        /* Content */
        .content {
            flex-grow: 1;
            display: flex;
            flex-direction: row;
            padding: 15px;
            background: #222;
            overflow: hidden;
        }

        /* Search Results */
        .search-results {
            width: 50%;
            overflow-y: auto;
            padding-right: 15px;
            max-height: 100%;
        }

        .site-card {
            display: flex;
            align-items: center;
            background: #333;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            color: white;
            cursor: pointer;
            gap: 15px; /* Adds spacing between image and text */
        }
        
        .site-card:hover {
            background: #444;
        }
        
        .site-card img {
            width: 120px; /* Adjust image width */
            height: 120px; /* Adjust image height */
            object-fit: cover;
            border-radius: 5px;
        }


        .site-card h3 {
            margin: 0;
            color: #03FDFC;
        }

        /* Map */
        #map {
            width: 50%;
            height: 100%;
            border-radius: 10px;
            background: #333;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <img id="logo" src="traipse_logo_turquoise.png" alt="Traipse Logo">
        <span class="tagline">Step into the past—explore history, culture, and hidden gems near you.</span>
        <div class="title-container">TRAIPSE</div>
    </div>

    <!-- Main Layout -->
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h2>Filters</h2>
        <div class="filter-group">
            <label>Time Period:</label>
            <div class="timePeriod-group">
                <label>
                    <input type="checkbox" class="timePeriodFilter" value="prehistoric"> Prehistoric
                </label>
                <span class="timePeriod-years">(Before 1492)</span>
        
                <label>
                    <input type="checkbox" class="timePeriodFilter" value="indigenous"> Indigenous & Native History
                </label>
                <span class="timePeriod-years">(Before 1492 – Present)</span>
        
                <label>
                    <input type="checkbox" class="timePeriodFilter" value="colonial"> Colonial & Early Settlements
                </label>
                <span class="timePeriod-years">(1492 – 1800)</span>
        
                <label>
                    <input type="checkbox" class="timePeriodFilter" value="nineteenthcentury"> 19th Century & Westward Expansion
                </label>
                <span class="timePeriod-years">(1800 – 1899)</span>
        
                <label>
                    <input type="checkbox" class="timePeriodFilter" value="industrialrevolution"> Industrial Revolution & 20th Century
                </label>
                <span class="timePeriod-years">(1900 – 1950s)</span>
        
                <label>
                    <input type="checkbox" class="timePeriodFilter" value="modernhistory"> Modern History or Civil Rights
                </label>
                <span class="timePeriod-years">(1950s – Present)</span>
        
                <label>
                    <input type="checkbox" class="timePeriodFilter" value="other"> Other
                </label>
            </div>
        </div>



            
            <div class="filter-group">
                <label>Thematic Category:</label>
                <select id="ThematicCategoryFilter">
                    <option value="all">All</option>
                    <option value="artsandculture">Arts and Culture</option>
                    <option value="foodanddrink">Food and Drink</option>
                    <option value="generalhistory">General History</option>
                    <option value="historichomes">Historic Homes</option>
                    <option value="naturalhistory">Natural History</option>
                    <option value="religiousandspiritual">Religious and Spiritual</option>
                    <option value="other">Other</option>
                    <option value="technologyandtransportation">Technology and Transportation</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Cost:</label>
                <select id="costFilter">
                    <option value="all">All</option>
                    <option value="free">Free</option>
                    <option value="paid">Paid</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Type:</label>
                <select id="typeFilter">
                    <option value="all">All</option>
                    <option value="indoor">Indoor</option>
                    <option value="outdoor">Outdoor</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Family Friendly:</label>
                <select id="familyFilter">
                    <option value="all">All</option>
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Local or National:</label>
                <select id="localOrNationalFilter">
                    <option value="all">All</option>
                    <option value="local">Local</option>
                    <option value="national">National</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label>Distance:</label>
                <select id="distanceFilter">
                    <option value="all">All</option>
                    <option value="1">Less than 1 mile</option>
                    <option value="5">1-5 miles</option>
                    <option value="10">More than 10 miles</option>
                </select>
            </div>

            <button onclick="applyFilters()">Apply Filters</button>
        </div>

        <!-- Content -->
        <div class="content">
            <div class="search-results" id="searchResults"></div>
            <div id="map"></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        var map = L.map('map').setView([39.7392, -104.9903], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        var userLocation = null;
        
        var allMarkers = [];
        var siteData = [];

function getUserLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            position => {
                userLocation = {
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                };
                console.log("User location retrieved:", userLocation);
                loadLocations(); // Load locations after getting user location
            },
            error => {
                console.error("Error getting location:", error);
                loadLocations(); // Proceed even if location is not available
            }
        );
    } else {
        console.warn("Geolocation is not supported by this browser.");
        loadLocations();
    }
}

function getDistance(lat1, lon1, lat2, lon2) {
    const R = 3958.8; // Radius of Earth in miles
    const toRad = angle => angle * (Math.PI / 180);

    let dLat = toRad(lat2 - lat1);
    let dLon = toRad(lon2 - lon1);

    let a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);

    let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}
        
// Existing function
function loadLocations() {
    fetch('locations.json')
        .then(response => response.json())
        .then(data => {
            siteData = data;
            applyFilters();
        })
        .catch(error => console.error("Error loading JSON:", error));
}


function applyFilters() {
    let selectedCost = document.getElementById("costFilter").value;
    let selectedType = document.getElementById("typeFilter").value;
    let selectedFamily = document.getElementById("familyFilter").value;
    let selectedLocalOrNational = document.getElementById("localOrNationalFilter").value;
    let selectedThematicCategory = document.getElementById("ThematicCategoryFilter").value;
    let selectedDistance = document.getElementById("distanceFilter").value;

    // Get selected time periods (array of checked values)
    let selectedTimePeriods = Array.from(document.querySelectorAll(".timePeriodFilter:checked")).map(cb => cb.value);

    let resultsContainer = document.getElementById("searchResults");
    resultsContainer.innerHTML = "";
    allMarkers.forEach(marker => map.removeLayer(marker));
    allMarkers = [];

    siteData.forEach(site => {
        let distance = userLocation ? getDistance(userLocation.lat, userLocation.lng, site.lat, site.lng) : null;

        // Check if site has at least one of the selected time periods
        let matchesTimePeriod = selectedTimePeriods.length === 0 || 
            site.timeperiod.some(period => selectedTimePeriods.includes(period));

        if ((selectedCost === "all" || site.cost.toLowerCase() === selectedCost) &&
            (selectedType === "all" || site.type.toLowerCase() === selectedType) &&
            (selectedFamily === "all" || String(site.family_friendly).toLowerCase() === selectedFamily) &&
            (selectedThematicCategory === "all" || site.thematiccategory.toLowerCase() === selectedThematicCategory) &&
            (selectedLocalOrNational === "all" || site.localornational.toLowerCase() === selectedLocalOrNational) &&
            (selectedDistance === "all" ||
             (distance !== null &&
              ((selectedDistance === "1" && distance < 1) ||
               (selectedDistance === "5" && distance >= 1 && distance <= 5) ||
               (selectedDistance === "10" && distance > 10)))) &&
            matchesTimePeriod) {

            let marker = L.marker([site.lat, site.lng]).bindPopup(`<b>${site.name}</b><br>${site.description}`);
            marker.addTo(map);
            allMarkers.push(marker);

            let siteCard = document.createElement("div");
            siteCard.className = "site-card";
            siteCard.style.display = "flex";  
            siteCard.style.flexDirection = "column";  
            siteCard.style.alignItems = "center"; // Center items in the card

            siteCard.innerHTML = `
                <img src="${site.image}" alt="${site.name}">
                <div class="site-info">
                    <h3>${site.name}</h3>
                    <p>${site.description}</p>
                    <p><strong>Time period:</strong> ${site.timeperiod.join(", ")}</p>
                    <p><strong>Category:</strong> ${site.thematiccategory}</p>
                    <p><strong>Cost:</strong> ${site.cost}</p>
                    <p><strong>Type:</strong> ${site.type}</p>
                    <p><strong>Local/National:</strong> ${site.localornational}</p>
                    <p><strong>Distance:</strong> ${userLocation ? getDistance(userLocation.lat, userLocation.lng, site.lat, site.lng).toFixed(1) + " miles" : "Unknown"}</p>
                </div>
            `;


            siteCard.onclick = () => {
                map.setView([site.lat, site.lng], 14);
                marker.openPopup();
            };
            resultsContainer.appendChild(siteCard);
        }
    });
}



        loadLocations();
    </script>
</body>
</html>
