<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traipse - Discover History</title>

    <!-- Leaflet Library -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: #111;
            color: #03FDFC;
            height: 65px;
        }

        .website-title {
            font-size: 2em;
            font-weight: 900;
            text-transform: uppercase;
            color: #03FDFC;
            margin-left: 15px;
        }

        /* Layout */
        .container {
            display: flex;
            flex-direction: row;
            height: calc(100vh - 65px);
        }

        /* Left Panel */
        .left-panel {
            width: 50%;
            background: #181818;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .left-panel h2 {
            color: #03FDFC;
            font-size: 1.2em;
        }

        /* Map */
        .map-container {
            width: 50%;
            height: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* City Filter Dropdown */
        .city-filter-dropdown {
            font-size: 1em;
            padding: 8px 12px;
            border-radius: 5px;
            border: 2px solid #03FDFC;
            background-color: #111;
            color: #03FDFC;
            cursor: pointer;
        }

        .city-filter-dropdown:hover {
            background: #03FDFC;
            color: #000;
        }

    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="website-title">TRAIPSE - DISCOVER HISTORY</div>

        <select id="cityFilter" class="city-filter-dropdown" onchange="applyFilters()">
            <option value="denver">Denver</option>
            <option value="washingtondc">Washington D.C.</option>
            <option value="philadelphia">Philadelphia</option>
            <option value="boston">Boston</option>
            <option value="chicago">Chicago</option>
            <option value="newyorkcity">New York City</option>
            <option value="atlanta">Atlanta</option>
            <option value="neworleans">New Orleans</option>
            <option value="sanfrancisco">San Francisco</option>
        </select>
    </div>

    <!-- Main Layout -->
    <div class="container">
        <!-- Left Panel (Space for Future Features) -->
        <div class="left-panel">
            <h2>Explore Historic Areas</h2>
            <div id="searchResults"></div>
        </div>

        <!-- Map Section -->
        <div class="map-container">
            <div id="map"></div>
        </div>
    </div>

    <script>
        // Load last selected city from localStorage (default: Denver)
        let selectedCity = localStorage.getItem("selectedCity") || "denver";
        document.getElementById("cityFilter").value = selectedCity;

        // Initialize Map
        let map = L.map('map').setView([39.7392, -104.9903], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Historic Site Data (Per City)
        let cityData = {
            denver: [
                [39.7480, -104.9991, 1.3],  // Larimer Square
                [39.7565, -104.9701, 1.2],  // Five Points
                [39.7400, -104.9784, 1.3],  // Capitol Hill
                [39.7527, -104.9990, 1.2],  // LoDo
                [39.7339, -104.9925, 1.0],  // Cheesman Park
                [39.7215, -104.9872, 1.1],  // Baker Historic District
                [39.7686, -104.9719, 1.0],  // Whittier Neighborhood
                [39.7600, -105.0050, 1.0]   // Highland (LoHi)
            ],
              // Boulder - Historic Areas
            [40.0176, -105.2797, 1.3],  // Pearl Street Mall
            [40.0069, -105.2694, 1.2],  // Mapleton Hill
            [39.9980, -105.2813, 1.1],  // Chautauqua Park
        
            // Golden - Historic Areas
            [39.7555, -105.2211, 1.3],  // Downtown Golden
        
            // Morrison - Historic Areas
            [39.6553, -105.1911, 1.2],  // Morrison Historic District
        
            // Aurora - Historic Areas
            [39.7420, -104.8384, 1.1],  // Fitzsimons Historic District
        
            // Lakewood - Historic Areas
            [39.7067, -105.0814, 1.1],  // Heritage Lakewood Belmar Park
        
            // Littleton - Historic Areas
            [39.6133, -105.0166, 1.3],  // Littleton Main Street Historic District
        
            // Arvada - Historic Areas
            [39.8006, -105.0817, 1.2],  // Olde Town Arvada
        
            // Westminster - Historic Areas
            [39.8364, -105.0372, 1.0],  // Harris Park Historic District
            washingtondc: [
                [38.8977, -77.0365, 1.3], // White House
                [38.8895, -77.0352, 1.2], // National Mall
                [38.8976, -77.0431, 1.2]  // Lafayette Square
            ],
            philadelphia: [
                [39.9523, -75.1638, 1.3], // Independence Hall
                [39.9489, -75.1503, 1.2]  // Liberty Bell
            ],
            boston: [
                [42.3601, -71.0589, 1.3], // Boston Common
                [42.3576, -71.0605, 1.2]  // Old State House
            ],
            chicago: [
                [41.8781, -87.6298, 1.3], // Downtown Chicago
                [41.8827, -87.6233, 1.2]  // Millennium Park
            ],
            newyorkcity: [
                [40.7128, -74.0060, 1.3], // Downtown Manhattan
                [40.7488, -73.9854, 1.2]  // Empire State Building
            ],
            atlanta: [
                [33.7490, -84.3880, 1.3], // Downtown Atlanta
                [33.7488, -84.3877, 1.2]  // Centennial Olympic Park
            ],
            neworleans: [
                [29.9511, -90.0715, 1.3], // French Quarter
                [29.9584, -90.0659, 1.2]  // St. Louis Cemetery
            ],
            sanfrancisco: [
                [37.7749, -122.4194, 1.3], // Golden Gate Park
                [37.8087, -122.4098, 1.2]  // Fisherman's Wharf
            ]
        };

        let heatLayer;

        function applyFilters() {
            // Save selected city to localStorage
            selectedCity = document.getElementById("cityFilter").value;
            localStorage.setItem("selectedCity", selectedCity);

            // Update Map
            let cityCoords = cityData[selectedCity];
            map.setView(cityCoords[0].slice(0, 2), 12);

            if (heatLayer) {
                map.removeLayer(heatLayer);
            }

            heatLayer = L.heatLayer(cityCoords, {
                radius: 75,
                blur: 25,
                maxOpacity: 0.8,
                gradient: { 0.3: "blue", 0.5: "lime", 0.7: "yellow", 1.0: "red" }
            }).addTo(map);
        }

        applyFilters(); // Run on page load

    </script>

</body>
</html>
