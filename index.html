<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traipse - Denver Cultural & Historical Sites</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>
    <header>
        <h1>Traipse</h1>
        <p>Explore Denver's cultural and historical sites</p>
    </header>
    <main>
        <div id="map"></div>
    </main>
    <script>
        var map = L.map('map').setView([39.7392, -104.9903], 12);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        
        fetch('locations.json')
            .then(response => response.json())
            .then(data => {
                data.forEach(site => {
                    L.marker([site.lat, site.lng]).addTo(map)
                        .bindPopup(`<b>${site.name}</b><br>${site.description}`);
                });
            });
    </script>
</body>
</html>
