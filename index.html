<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traipse - Discover History Around You</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>

    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #000000;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: #111;
            color: #03FDFC;
            font-size: 1.5em;
            font-weight: bold;
        }

        #logo {
            width: 80px;
        }

        /* Main Container - Sidebar + Content */
        .container {
            display: flex;
            height: calc(100vh - 60px);
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: #181818;
            padding: 15px;
            color: white;
            overflow-y: auto;
        }

        .sidebar h2 {
            color: #03FDFC;
            font-size: 1.2em;
        }

        .filter-group {
            margin-bottom: 20px;
        }

        .filter-group label {
            display: block;
            margin: 8px 0;
            font-size: 1em;
        }

        .filter-group select {
            width: 100%;
            padding: 8px;
            font-size: 1em;
            border-radius: 5px;
            border: none;
        }

        button {
            background-color: #03FDFC;
            color: #000;
            border: none;
            padding: 10px;
            font-size: 1em;
            width: 100%;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
        }

        button:hover {
            background-color: #02c9c9;
        }

        /* Content - Search Results + Map */
        .content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            background: #222;
        }

        .search-results {
            flex-grow: 1;
            overflow-y: auto;
        }

        .site-card {
            display: flex;
            align-items: center;
            background: #333;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            color: white;
        }

        .site-card img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 5px;
            margin-right: 15px;
        }

        .site-card h3 {
            margin: 0;
            color: #03FDFC;
        }

        /* Map */
        #map {
            height: 40vh;
            width: 100%;
            border-radius: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <img id="logo" src="traipse_logo_turquoise.png" alt="Traipse Logo">
        <div>TRAIPSE</div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h2>Filters</h2>

            <div class="filter-group">
                <label>Cost:</label>
                <select id="costFilter">
                    <option value="all">All</option>
                    <option value="free">Free</option>
                    <option value="paid">Paid</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Type:</label>
                <select id="typeFilter">
                    <option value="all">All</option>
                    <option value="indoor">Indoor</option>
                    <option value="outdoor">Outdoor</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Family Friendly:</label>
                <select id="familyFilter">
                    <option value="all">All</option>
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Local or National:</label>
                <select id="localOrNationalFilter">
                    <option value="all">All</option>
                    <option value="local">Local</option>
                    <option value="national">National</option>
                </select>
            </div>

            <button onclick="applyFilters()">Apply Filters</button>
        </div>

        <!-- Content -->
        <div class="content">
            <div class="search-results" id="searchResults"></div>
            <div id="map"></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        var map = L.map('map').setView([39.7392, -104.9903], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        var allMarkers = [];
        var siteData = [];

        function loadLocations() {
            fetch('locations.json')
                .then(response => response.json())
                .then(data => {
                    siteData = data;
                    updateResults();
                    updateMarkers();
                })
                .catch(error => console.error("Error loading JSON:", error));
        }

        function updateResults() {
            let resultsContainer = document.getElementById("searchResults");
            resultsContainer.innerHTML = "";

            siteData.forEach(site => {
                let resultItem = document.createElement("div");
                resultItem.className = "site-card";
                resultItem.innerHTML = `
                    <img src="images/${site.name.toLowerCase().replace(/\s/g, "_")}.jpg" onerror="this.style.display='none'" alt="${site.name}">
                    <div>
                        <h3>${site.name}</h3>
                        <p>${site.description}</p>
                    </div>
                `;
                resultsContainer.appendChild(resultItem);
            });
        }

        function applyFilters() {
            let selectedCost = document.getElementById("costFilter").value;
            let selectedType = document.getElementById("typeFilter").value;
            let selectedFamily = document.getElementById("familyFilter").value;
            let selectedLocalOrNational = document.getElementById("localOrNationalFilter").value;

            allMarkers.forEach(marker => map.removeLayer(marker));
            allMarkers = [];

            let filteredData = siteData.filter(site => 
                (selectedCost === "all" || site.cost.toLowerCase() === selectedCost) &&
                (selectedType === "all" || site.type.toLowerCase() === selectedType) &&
                (selectedFamily === "all" || String(site.family_friendly) === selectedFamily) &&
                (selectedLocalOrNational === "all" || String(site.localornational) === selectedLocalOrNational)
            );

            filteredData.forEach(site => {
                let marker = L.marker([site.lat, site.lng]).bindPopup(`<b>${site.name}</b><br>${site.description}`);
                marker.addTo(map);
                allMarkers.push(marker);
            });

            updateResults();
        }

        loadLocations();
    </script>
</body>
</html>
