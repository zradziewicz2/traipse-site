<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traipse</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        body {
            background-color: #111;
            color: cyan;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            margin: 0;
        }
        #container {
            display: flex;
            width: 100%;
        }
        #filters {
            width: 20%;
            padding: 10px;
            background: #222;
            overflow-y: auto;
        }
        #list {
            width: 30%;
            overflow-y: auto;
            padding: 10px;
            background: #181818;
        }
        #map {
            width: 50%;
            height: 100vh;
        }
        button {
            background: cyan;
            border: none;
            padding: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .list-item {
            padding: 10px;
            border-bottom: 1px solid cyan;
        }
    </style>
</head>
<body>
    <div id="container">
        <aside id="filters">
            <h2>Filters</h2>
            <div id="dropdown-filters"></div>
            <div id="checkbox-filters"></div>
            <button id="applyFilters">Apply Filters</button>
        </aside>
        <main>
            <section id="list"></section>
        </main>
        <aside id="map"></aside>
    </div>
    
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        let map = L.map('map').setView([39.7392, -104.9903], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        fetch('TraipseData_Full.json')
            .then(response => response.json())
            .then(data => {
                const listContainer = document.getElementById('list');
                const dropdownFilters = document.getElementById('dropdown-filters');
                const checkboxFilters = document.getElementById('checkbox-filters');
                
                let filters = {};
                
                let dropdownAttributes = ["type", "localornational", "cost", "distance", "reservation", "guided_tour", "accessible_by_transit", "family_friendly", "dog_friendly", "gift_shop", "dining_on_site", "hidden_gem", "spanish_translations", "open_on_mondays", "open_past_6_pm", "open_before_10_am", "luggage_storage", "cash_vs_credit_card", "public_access"];
                let checkboxAttributes = ["historical_time_period", "thematic_category", "estimated_timeframe"];
                
                dropdownAttributes.forEach(attr => {
                    let select = document.createElement('select');
                    select.id = attr;
                    select.innerHTML = `<option value="">All ${attr.replace('_', ' ')}</option>`;
                    filters[attr] = "";
                    dropdownFilters.appendChild(select);
                });
                
                checkboxAttributes.forEach(attr => {
                    let div = document.createElement('div');
                    div.innerHTML = `<h3>${attr.replace('_', ' ')}</h3>`;
                    checkboxFilters.appendChild(div);
                    filters[attr] = new Set();
                });
                
                data.forEach(site => {
                    let marker = L.marker([site.lat, site.lng]).addTo(map);
                    marker.bindPopup(`<b>${site.name}</b><br>${site.description}`);

                    let listItem = document.createElement('div');
                    listItem.className = 'list-item';
                    listItem.innerHTML = `<b>${site.name}</b><p>${site.description}</p>`;
                    listContainer.appendChild(listItem);
                });
            });
    </script>
</body>
</html>
