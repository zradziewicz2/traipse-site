<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traipse - Discover History Around You</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>

    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #000000;
            margin: 0;
            text-align: center;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            position: relative;
        }

        #logo {
            width: 80px;
            position: absolute;
            left: 15px;
            top: 5px;
        }

        h1 {
            font-size: 2.5em;
            margin: 0;
            color: #03FDFC;
            font-weight: bold;
        }

        .menu-icon {
            position: absolute;
            right: 15px;
            top: 15px;
            width: 30px;
            height: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }

        .menu-icon div {
            width: 100%;
            height: 5px;
            background-color: #03FDFC;
            border-radius: 5px;
        }

        p {
            font-size: 1.2em;
            color: #03FDFC;
            font-style: italic;
            margin-bottom: 10px;
        }

        #filters {
            margin-bottom: 15px;
            padding: 10px;
        }

        #filters label {
            color: white;
        }

        select, button {
            padding: 8px 12px;
            font-size: 1em;
            border-radius: 5px;
            border: none;
            margin: 5px;
        }

        button {
            background-color: #2b4d7f;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #1f3c61;
        }

        #map {
            height: 75vh;
            width: 90%;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="header">
        <img id="logo" src="traipse_logo_turquoise.png" alt="Traipse Logo">
        <h1>TRAIPSE</h1>
        <div class="menu-icon">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </div>

    <p>Step into the past—explore history, culture, and hidden gems near you.</p>

    <div id="filters">
        <label>Cost:</label>
        <select id="costFilter">
            <option value="all">All</option>
            <option value="free">Free</option>
            <option value="paid">Paid</option>
        </select>

        <label>Type:</label>
        <select id="typeFilter">
            <option value="all">All</option>
            <option value="indoor">Indoor</option>
            <option value="outdoor">Outdoor</option>
        </select>

        <label>Family Friendly:</label>
        <select id="familyFilter">
            <option value="all">All</option>
            <option value="true">Yes</option>
            <option value="false">No</option>
        </select>

        <label>Local or National:</label>
        <select id="localornational">
            <option value="all">All</option>
            <option value="true">Local</option>
            <option value="false">National</option>
        </select>

        <button onclick="applyFilters()">Apply Filters</button>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        var map = L.map('map').setView([39.7392, -104.9903], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        var allMarkers = [];
        var siteData = [];

        function loadLocations() {
            fetch('locations.json')
                .then(response => response.json())
                .then(data => {
                    siteData = data;
                    updateMarkers();
                })
                .catch(error => console.error("Error loading JSON:", error));
        }

        function updateMarkers() {
            allMarkers.forEach(marker => map.removeLayer(marker));
            allMarkers = [];

            siteData.forEach(site => {
                let marker = L.marker([site.lat, site.lng]).bindPopup(
                    `<b>${site.name}</b><br>${site.description}<br><b>Cost:</b> ${site.cost}<br><b>Type:</b> ${site.type}<br><b>Family Friendly:</b> ${site.family_friendly ? "Yes" : "No"}`
                );
                marker.siteData = site;
                allMarkers.push(marker);
                marker.addTo(map);
            });
        }

 function applyFilters() {
            let selectedCost = document.getElementById("costFilter").value;
            let selectedType = document.getElementById("typeFilter").value;
            let selectedFamily = document.getElementById("familyFilter").value;
            let selectedLocalOrNational = document.getElementById("localOrNationalFilter").value;

            allMarkers.forEach(marker => map.removeLayer(marker));
            allMarkers = [];

            siteData.forEach(site => {
                let matchesCost = selectedCost === "all" || site.cost === selectedCost;
                let matchesType = selectedType === "all" || site.type === selectedType;
                let matchesFamily = selectedFamily === "all" || String(site.family_friendly) === selectedFamily;
                let matchesLocalOrNational = selectedLocalOrNational === "all" || site.history_scope === selectedLocalOrNational;

                if (matchesCost && matchesType && matchesFamily && matchesLocalOrNational) {
                    let marker = L.marker([site.lat, site.lng]).bindPopup(
                        `<b>${site.name}</b><br>${site.description}<br><b>Cost:</b> ${site.cost}<br><b>Type:</b> ${site.type}<br><b>Family Friendly:</b> ${site.family_friendly ? "Yes" : "No"}<br><b>Scope:</b> ${site.history_scope}`
                    );
                    marker.siteData = site;
                    allMarkers.push(marker);
                    marker.addTo(map);
                }
            });
        }

        loadLocations();
    </script>
</body>
</html>
