function getUserLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            position => {
                userLocation = {
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                };
                console.log("User location retrieved:", userLocation);
                loadLocations(); // Load locations after getting user location
            },
            error => {
                console.error("Error getting location:", error);
                loadLocations(); // Proceed even if location is not available
            }
        );
    } else {
        console.warn("Geolocation is not supported by this browser.");
        loadLocations();
    }
}

function getDistance(lat1, lon1, lat2, lon2) {
    const R = 3958.8; // Radius of Earth in miles
    const toRad = angle => angle * (Math.PI / 180);

    let dLat = toRad(lat2 - lat1);
    let dLon = toRad(lon2 - lon1);

    let a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);

    let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}

function applyRouteFilters() {
    fetch('routes.json')
        .then(response => response.json())
        .then(routesData => {
            let thematic = document.getElementById("routeThematicCategoryFilter").value;
            let siteCount = document.getElementById("routeSiteCountFilter").value;
            let distance = document.getElementById("routeDistanceFilter").value;
            let cost = document.getElementById("routeCostFilter").value;
            let timeOfDay = document.getElementById("routeTimeFilter").value;
            let duration = document.getElementById("routeDurationFilter").value;
            let topic = document.getElementById("routeTopicFilter").value;
            let groupType = document.getElementById("routeGroupTypeFilter").value;
            let reservation = document.getElementById("routeReservationFilter").value;

            const filteredRoutes = routesData.filter(route => {
                return (
                    (thematic === "all" || route.thematiccategory?.includes(thematic)) &&
                    (siteCount === "all" || (siteCount === "3" && route.sites.length === 3) ||
                        (siteCount === "5" && route.sites.length >= 5)) &&
                    (distance === "all" || route.distance === distance) &&
                    (cost === "all" || route.cost === cost) &&
                    (selectedTimeOfDay === "all" || (route.timeofday && route.timeofday.includes(selectedTimeOfDay)))
                    (duration === "all" || route.duration === duration) &&
                    (topic === "all" || route.special_topic?.includes(topic)) &&
                    (groupType === "all" || route.group_type === groupType) &&
                    (reservation === "all" || String(route.reservation_required) === reservation)
                );
            });

            displayRoutes(filteredRoutes);
            loadRouteDates(filteredRoutes);
        })
        .catch(error => console.error("Error applying route filters:", error));
}
// Load and Display Calendar Dates
function loadRouteDates(routesData) {
    const calendarSection = document.getElementById("calendarSection");
    const tourCalendar = document.getElementById("tourCalendar");

    tourCalendar.innerHTML = ""; // Clear previous dates

    let allDates = [];

    routesData.forEach(route => {
        if (route.dates) {
            allDates.push(...route.dates);
        }
    });

    // Remove duplicates and sort dates
    const uniqueDates = [...new Set(allDates)].sort((a, b) => new Date(a) - new Date(b));

    uniqueDates.forEach(date => {
        const dateElement = document.createElement("div");
        dateElement.classList.add("tour-date");
        dateElement.textContent = date;
        tourCalendar.appendChild(dateElement);
    });

    calendarSection.style.display = uniqueDates.length > 0 ? "block" : "none";
}

function toggleMyPlaces(siteId, element) {
    console.log(`Toggling My Places for site ID: ${siteId}`);

    let myPlaces = JSON.parse(localStorage.getItem('myPlaces')) || [];
    let notInterested = JSON.parse(localStorage.getItem('notInterested')) || [];

    let site = siteData.find(s => s.id === siteId);
    if (!site) {
        console.error(`Site with ID ${siteId} not found.`);
        return;
    }

    let index = myPlaces.findIndex(s => s.id === siteId);

    if (index > -1) {
        // Remove from My Places
        myPlaces.splice(index, 1);
        element.textContent = "☆"; // Hollow star
        element.style.color = "white";
        element.classList.remove("active");
    } else {
        // Add to My Places
        myPlaces.push(site);
        element.textContent = "⭐"; // Filled star
        element.style.color = "gold";
        element.classList.add("active");

        // Remove from Not Interested if it was marked
        let notIndex = notInterested.findIndex(s => s.id === siteId);
        if (notIndex > -1) {
            notInterested.splice(notIndex, 1);
            let xIcon = document.getElementById(`x-${siteId}`);
            if (xIcon) {
                xIcon.textContent = "✖"; // Default X
                xIcon.classList.remove("active");
            }
        }
    }

    localStorage.setItem('myPlaces', JSON.stringify(myPlaces));
    localStorage.setItem('notInterested', JSON.stringify(notInterested));

    console.log("Updated My Places:", myPlaces);
}

                } else {
                    notInterested.push(site);
                    element.textContent = "❌";
                    element.classList.add("active");
            
                    let myIndex = myPlaces.findIndex(s => s.id === siteId);
                    if (myIndex > -1) {
                        myPlaces.splice(myIndex, 1);
                        let starIcon = document.getElementById(`star-${siteId}`);
                        if (starIcon) {
                            starIcon.textContent = "☆";
                            starIcon.classList.remove("active");
                        }
                    }
                }
            
                localStorage.setItem('myPlaces', JSON.stringify(myPlaces));
                localStorage.setItem('notInterested', JSON.stringify(notInterested));
            
                console.log("Updated Not Interested:", notInterested);
            }



</script>
</body>
</html>
