<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traipse - Discover History Around You</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>

    <!-- Custom Styles -->
    <style>
        /* General Page Styling */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #000000; /* Light Blue Background */
            margin: 0;
            text-align: center;
        }

        /* Header Section */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            position: relative;
        }

        /* Logo in the Top Left */
        #logo {
            width: 80px; /* Adjust size as needed */
            position: absolute;
            left: 15px;
            top: 5px;
        }

        /* Page Title */
        h1 {
            font-size: 2.5em;
            margin: 0;
            color: #2b4d7f; /* Deep Blue */
            font-weight: bold;
        }

        /* Menu Icon in the Top Right */
        .menu-icon {
            position: absolute;
            right: 15px;
            top: 15px;
            width: 30px;
            height: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }

        .menu-icon div {
            width: 100%;
            height: 5px;
            background-color: #2b4d7f; /* Matches text color */
            border-radius: 5px;
        }

        /* Tagline */
        p {
            font-size: 1.2em;
            color: #3b3b3b;
            font-style: italic;
            margin-bottom: 10px;
        }

        /* Filter Controls */
        #filters {
            margin-bottom: 15px;
            padding: 10px;
        }

        select, button {
            padding: 8px 12px;
            font-size: 1em;
            border-radius: 5px;
            border: none;
            margin: 5px;
        }

        button {
            background-color: #2b4d7f;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #1f3c61;
        }

        /* Map Styling */
        #map {
            height: 75vh; /* Takes up 75% of the screen */
            width: 90%; /* Slightly reduced width */
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }
    </style>

    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap">
</head>
<body>

    <!-- Header with Logo & Menu Icon -->
    <div class="header">
        <img id="logo" src="traipse_logo_turquoise.png" alt="Traipse Logo">
        <h1>TRAIPSE</h1>
        <div class="menu-icon">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </div>

    <p>Step into the past—explore history, culture, and hidden gems near you.</p>

    <!-- Filter Controls -->
    <div id="filters">
        <label>Cost:</label>
        <select id="costFilter">
            <option value="all">All</option>
            <option value="free">Free</option>
            <option value="paid">Paid</option>
        </select>

        <label>Type:</label>
        <select id="typeFilter">
            <option value="all">All</option>
            <option value="indoor">Indoor</option>
            <option value="outdoor">Outdoor</option>
        </select>

        <label>Family Friendly:</label>
        <select id="familyFilter">
            <option value="all">All</option>
            <option value="true">Yes</option>
            <option value="false">No</option>
        </select>

        <button onclick="applyFilters()">Apply Filters</button>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <script>
        var map = L.map('map').setView([39.7392, -104.9903], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        var allMarkers = [];

        // Function to load locations from JSON
        function loadLocations() {
            fetch('locations.json')
                .then(response => response.json())
                .then(data => {
                    allMarkers.forEach(marker => map.removeLayer(marker));
                    allMarkers = [];

                    data.forEach(site => {
                        let marker = L.marker([site.lat, site.lng]).bindPopup(
                            `<b>${site.name}</b><br>${site.description}<br><b>Cost:</b> ${site.cost}<br><b>Type:</b> ${site.type}<br><b>Family Friendly:</b> ${site.family_friendly ? "Yes" : "No"}`
                        );
                        marker.siteData = site;
                        allMarkers.push(marker);
                        marker.addTo(map);
                    });
                })
                .catch(error => console.error("Error loading JSON:", error));
        }

        loadLocations();

        // Function to apply filters
        function applyFilters() {
            let selectedCost = document.getElementById("costFilter").value;
            let selectedType = document.getElementById("typeFilter").value;
            let selectedFamily = document.getElementById("familyFilter").value;

            allMarkers.forEach(marker => {
                let site = marker.siteData;
                let matchesCost = selectedCost === "all" || site.cost === selectedCost;
                let matchesType = selectedType === "all" || site.type === selectedType;
                let matchesFamily = selectedFamily === "all" || site.family_friendly.toString() === selectedFamily;

                if (matchesCost && matchesType && matchesFamily) {
                    marker.addTo(map);
                } else {
                    map.removeLayer(marker);
                }
            });
        }
    </script>

</body>
</html>
