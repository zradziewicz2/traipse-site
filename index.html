<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traipse</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        body {
            background-color: #111;
            color: cyan;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            margin: 0;
        }
        #container {
            display: flex;
            width: 100%;
        }
        #filters {
            width: 20%;
            padding: 10px;
            background: #222;
        }
        #list {
            width: 40%;
            overflow-y: auto;
            padding: 10px;
        }
        #map {
            width: 40%;
            height: 100vh;
        }
        button {
            background: cyan;
            border: none;
            padding: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="container">
        <aside id="filters">
            <h2>Filters</h2>
            <div id="dropdown-filters"></div>
            <div id="checkbox-filters">
                <h3>Historical Time Period</h3>
                <div id="historical_time_period"></div>
                <h3>Thematic Category</h3>
                <div id="thematic_category"></div>
                <h3>Estimated Timeframe</h3>
                <div id="estimated_timeframe"></div>
            </div>
            <button id="applyFilters">Apply Filters</button>
        </aside>
        <main>
            <section id="list"></section>
        </main>
        <aside id="map"></aside>
    </div>
    
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        let map = L.map('map').setView([39.7392, -104.9903], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        fetch('TraipseData_Full.json')
            .then(response => response.json())
            .then(data => {
                data.forEach(site => {
                    let marker = L.marker([site.lat, site.lng]).addTo(map);
                    marker.bindPopup(`<b>${site.name}</b><br>${site.description}`).openPopup();
                });
            });
    </script>
</body>
</html>
