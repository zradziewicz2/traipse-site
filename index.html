function getUserLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            position => {
                userLocation = {
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                };
                console.log("User location retrieved:", userLocation);
                loadLocations(); // Load locations after getting user location
            },
            error => {
                console.error("Error getting location:", error);
                loadLocations(); // Proceed even if location is not available
            }
        );
    } else {
        console.warn("Geolocation is not supported by this browser.");
        loadLocations();
    }
}

function getDistance(lat1, lon1, lat2, lon2) {
    const R = 3958.8; // Radius of Earth in miles
    const toRad = angle => angle * (Math.PI / 180);

    let dLat = toRad(lat2 - lat1);
    let dLon = toRad(lon2 - lon1);

    let a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);

    let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}

function toggleViewMode() {
    let toggleButton = document.getElementById("toggleViewMode");
    let isRoutesMode = toggleButton.innerText === "Sites";

    // Toggle button text
    toggleButton.innerText = isRoutesMode ? "Routes" : "Sites";

    // Show only relevant filters when Routes is selected
    let filtersToKeep = ["timePeriodFilter", "ThematicCategoryFilter", "typeFilter", "distanceFilter"];
    let allFilterGroups = document.querySelectorAll(".filter-group");

    allFilterGroups.forEach(group => {
        let filterId = group.querySelector("select, input")?.id || "";
        group.style.display = (isRoutesMode && filtersToKeep.includes(filterId)) || !isRoutesMode ? "block" : "none";
    });

    // Clear previous map elements
    allMarkers.forEach(marker => map.removeLayer(marker));
    allMarkers = [];

    // Load the appropriate dataset
    if (isRoutesMode) {
        loadRoutes();
    } else {
        loadLocations();
    }
}

        
function loadRoutes() {
    fetch('routes.json')
        .then(response => response.json())
        .then(data => {
            displayRoutes(data);
        })
        .catch(error => console.error("Error loading routes.json:", error));

function displayRoutes(routesData) {
    let resultsContainer = document.getElementById("searchResults");
    resultsContainer.innerHTML = "";
    allMarkers.forEach(marker => map.removeLayer(marker));
    allMarkers = [];

    routesData.forEach(route => {
        let routeCard = document.createElement("div");
        routeCard.className = "site-card";
        routeCard.innerHTML = `
            <div class="route-card-content">
                <img class="route-image" src="images/${route.image}" alt="${route.tour_name}">
                <div class="route-info">
                    <h3 class="site-title">${route.tour_name}</h3>
                    <p><strong>Sites in this tour:</strong> ${route.sites.length}</p>
                    <p class="site-description">Click to zoom to route.</p>
                </div>
            </div>
            <div class="route-sites"></div>
        `;

        let routeSitesContainer = routeCard.querySelector(".route-sites");
        let waypoints = route.route.map(coord => L.latLng(coord.lat, coord.lng));

        // Remove existing route controls before adding a new one
        if (!window.routeControls) {
            window.routeControls = [];
        }
        
        let newRouteControl = L.Routing.control({
            waypoints: waypoints,
            routeWhileDragging: false,
            createMarker: function() { return null; }, // Hide default markers
            lineOptions: {
                styles: [{ color: route.color, weight: 4, opacity: 0.8 }]
            }
        }).addTo(map);
        
        window.routeControls.push(newRouteControl);

        if (waypoints.length > 0) {
            map.fitBounds(L.latLngBounds(waypoints), { padding: [50, 50] });
        }

        // ✅ Add colored dots for each site
        route.sites.forEach(site => {
            let siteElement = document.createElement("div");
            siteElement.className = "route-site";
            siteElement.innerHTML = `
                <h4>${site.name} <a href="${site.website}" target="_blank" class="website-link">Website</a></h4>
            `;
            routeSitesContainer.appendChild(siteElement);

            // Add a circle marker with route-matching color
            let circleMarker = L.circleMarker([site.lat, site.lng], {
                radius: 6,
                color: route.color,
                fillColor: route.color,
                fillOpacity: 1
            }).bindPopup(`<b>${site.name}</b><br>${site.description}`);
            
            circleMarker.addTo(map);
            allMarkers.push(circleMarker);
        });

        routeCard.addEventListener("click", () => {
            if (waypoints.length > 0) {
                map.fitBounds(L.latLngBounds(waypoints), { padding: [50, 50] });
            }
        });

        resultsContainer.appendChild(routeCard);
    });
}

function toggleMyPlaces(siteId, element) {
    console.log(`Toggling My Places for site ID: ${siteId}`);

    let myPlaces = JSON.parse(localStorage.getItem('myPlaces')) || [];
    let notInterested = JSON.parse(localStorage.getItem('notInterested')) || [];

    let site = siteData.find(s => s.id === siteId);
    if (!site) {
        console.error(`Site with ID ${siteId} not found.`);
        return;
    }

    let index = myPlaces.findIndex(s => s.id === siteId);

    if (index > -1) {
        // Remove from My Places
        myPlaces.splice(index, 1);
        element.textContent = "☆"; // Hollow star
        element.style.color = "white";
        element.classList.remove("active");
    } else {
        // Add to My Places
        myPlaces.push(site);
        element.textContent = "⭐"; // Filled star
        element.style.color = "gold";
        element.classList.add("active");

        // Remove from Not Interested if it was marked
        let notIndex = notInterested.findIndex(s => s.id === siteId);
        if (notIndex > -1) {
            notInterested.splice(notIndex, 1);
            let xIcon = document.getElementById(`x-${siteId}`);
            if (xIcon) {
                xIcon.textContent = "✖"; // Default X
                xIcon.classList.remove("active");
            }
        }
    }

    localStorage.setItem('myPlaces', JSON.stringify(myPlaces));
    localStorage.setItem('notInterested', JSON.stringify(notInterested));

    console.log("Updated My Places:", myPlaces);
}

        "political": "Political and Government",
        "industrial": "Industrial and Technology",
        "outdoor": "Natural History or Outdoor",
        "other": "Other"
    };
    return typeMap[type.toLowerCase()] || "Other";
}

function translatePaymentMethod(method) {
    const methodMap = {
        "cash": "Cash",
        "credit": "Credit",
        "both": "Cash & Credit",
        "notapplicable": "Not Applicable"
    };
    return methodMap[method.toLowerCase()] || "Unknown";
}
        
            function toggleFilterCategory(categoryId) {
            let category = document.getElementById(categoryId);
            category.style.display = category.style.display === "none" ? "block" : "none";
        }
            
            function toggleNotInterested(siteId, element) {
                console.log(`Toggling Not Interested for site ID: ${siteId}`); // Debugging log
            
                let myPlaces = JSON.parse(localStorage.getItem('myPlaces')) || [];
                let notInterested = JSON.parse(localStorage.getItem('notInterested')) || [];
            
                let site = siteData.find(s => s.id === siteId);
                if (!site) {
                    console.error(`Site with ID ${siteId} not found.`);
                    return;
                }
            
                let index = notInterested.findIndex(s => s.id === siteId);
            
                if (index > -1) {
                    notInterested.splice(index, 1);
                    element.textContent = "✖";
                    element.classList.remove("active");
                } else {
                    notInterested.push(site);
                    element.textContent = "❌";
                    element.classList.add("active");
            
                    let myIndex = myPlaces.findIndex(s => s.id === siteId);
                    if (myIndex > -1) {
                        myPlaces.splice(myIndex, 1);
                        let starIcon = document.getElementById(`star-${siteId}`);
                        if (starIcon) {
                            starIcon.textContent = "☆";
                            starIcon.classList.remove("active");
                        }
                    }
                }
            
                localStorage.setItem('myPlaces', JSON.stringify(myPlaces));
                localStorage.setItem('notInterested', JSON.stringify(notInterested));
            
                console.log("Updated Not Interested:", notInterested);
            }
