<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traipse - Discover History Around You</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #000000;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: #111;
            color: #03FDFC;
        }
        #logo {
            width: 80px;
        }
        .tagline {
            flex-grow: 1;
            text-align: center;
            font-size: 1.2em;
            font-style: italic;
            color: #03FDFC;
        }
        .title-container {
            font-size: 2.2em;
            font-weight: bold;
            margin-left: auto;
        }
        .container {
            display: flex;
            flex-direction: row;
            height: calc(100vh - 80px);
        }
        .sidebar {
            width: 250px;
            background: #181818;
            padding: 15px;
            color: white;
            overflow-y: auto;
        }
        .sidebar h2 {
            color: #03FDFC;
            font-size: 1.2em;
        }
        .filter-group {
            margin-bottom: 15px;
        }
        .filter-group select {
            width: 100%;
            padding: 8px;
            font-size: 1em;
            border-radius: 5px;
            border: none;
        }
        button {
            background-color: #03FDFC;
            color: #000;
            border: none;
            padding: 10px;
            font-size: 1em;
            width: 100%;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #02c9c9;
        }
        .content {
            flex-grow: 1;
            display: flex;
            flex-direction: row;
            padding: 15px;
            background: #222;
            overflow: hidden;
        }
        .search-results {
            width: 50%;
            overflow-y: auto;
            padding-right: 15px;
            max-height: 100%;
        }
        #map {
            width: 50%;
            height: 100%;
            border-radius: 10px;
            background: #333;
        }
    </style>
</head>
<body>
    <div class="header">
        <img id="logo" src="traipse_logo_turquoise.png" alt="Traipse Logo">
        <span class="tagline">Step into the past—explore history, culture, and hidden gems near you.</span>
        <div class="title-container">TRAIPSE</div>
    </div>
    <div class="container">
        <div class="sidebar">
            <h2>Filters</h2>
            <div class="filter-group">
                <label>Distance:</label>
                <select id="distanceFilter">
                    <option value="all">All</option>
                    <option value="1">Within 1 mile</option>
                    <option value="5">Within 5 miles</option>
                    <option value="10">Within 10 miles</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Category:</label>
                <select id="ThematicCategoryFilter">
                    <option value="all">All</option>
                    <option value="artsandculture">Arts and Culture</option>
                    <option value="foodanddrink">Food and Drink</option>
                    <option value="generalhistory">General History</option>
                    <option value="historichomes">Historic Homes</option>
                    <option value="naturalhistory">Natural History</option>
                    <option value="religiousandspiritual">Religious and Spiritual</option>
                    <option value="other">Other</option>
                    <option value="technologyandtransportation">Technology and Transportation</option>
                </select>
            </div>
            <button onclick="applyFilters()">Apply Filters</button>
        </div>
        <div class="content">
            <div class="search-results" id="searchResults"></div>
            <div id="map"></div>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        var map = L.map('map').setView([39.7392, -104.9903], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        var userLocation = null;
        function getUserLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    userLocation = { lat: position.coords.latitude, lng: position.coords.longitude };
                    L.marker([userLocation.lat, userLocation.lng]).addTo(map).bindPopup("You are here").openPopup();
                    applyFilters();
                });
            }
        }
        function loadLocations() {
            fetch('locations.json')
                .then(response => response.json())
                .then(data => {
                    siteData = data;
                    getUserLocation();
                })
                .catch(error => console.error("Error loading JSON:", error));
        }
        loadLocations();
    </script>
</body>
</html>
