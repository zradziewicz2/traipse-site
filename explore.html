<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore - Traipse</title>

    <!-- Leaflet Library -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Heatmap Plugin -->
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: #111;
            color: #03FDFC;
            height: 65px;
            width: 100%;
            box-sizing: border-box;
        }

        .website-title {
            font-size: 2em;
            font-weight: 900;
            text-transform: uppercase;
            color: #03FDFC;
            margin-left: 15px;
        }

        #logo {
            width: auto;
            height: 50px;
            max-width: 100%;
            object-fit: contain;
            margin-left: 10px;
            display: block;
        }

        .tagline {
            font-size: 1em;
            font-family: 'Georgia', serif;
            font-weight: normal;
            color: #03FDFC;
            margin-left: 20px;
            white-space: nowrap;
            flex-grow: 0;
        }

        .header-buttons-container {
            display: flex;
            justify-content: flex-end;
            flex-grow: 1;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .header-btn {
            background: transparent;
            border: 2px solid #03FDFC;
            color: #03FDFC;
            font-size: 0.8em;
            font-weight: bold;
            padding: 5px 10px;
            min-width: 110px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 5px;
            text-align: center;
        }

        .header-btn:hover {
            background: #03FDFC;
            color: black;
        }

        .container {
            display: flex;
            flex-direction: row;
            height: calc(100vh - 65px);
        }

        .sidebar {
            width: 50%;
            background: #181818;
            padding: 20px;
            color: white;
            overflow-y: auto;
        }

        .map-container {
            width: 50%;
            height: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .toggle-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #03FDFC;
            border: 2px solid black;
            color: black;
            padding: 10px 15px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            box-shadow: 2px 2px 10px rgba(0, 255, 255, 0.3);
            z-index: 1000;
        }

        .toggle-btn:hover {
            background: #02c9c9;
        }
    </style>
</head>
<body>
    <div class="header">
        <img id="logo" src="traipse_logo_turquoise2.png" alt="Traipse Logo">
        <div class="website-title">TRAIPSE</div>

           <select id="cityFilter" class="city-filter-dropdown" onchange="saveSelectedCity()">
                <option value="all">All Cities</option>
                <option value="denver">Denver</option>
                <option value="washingtondc">Washington D.C.</option>
                <option value="philadelphia">Philadelphia</option>
                <option value="boston">Boston</option>
                <option value="chicago">Chicago</option>
                <option value="newyorkcity">New York City</option>
                <option value="atlanta">Atlanta</option>
                <option value="neworleans">New Orleans</option>
                <option value="sanfrancisco">San Francisco</option>
            </select>

        <span class="tagline">Step into the past—explore history, culture, and hidden gems near you.</span>
        <div class="header-buttons-container">
            <div class="header-buttons">
                <button class="header-btn">CONNECT</button>
                <button class="header-btn" onclick="window.location.href='myPlaces.html'">MY PLACES</button>
                <button class="header-btn">SUBMIT FEEDBACK</button>
                <button class="header-btn">DONATE</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <h2>Explore Historic Areas</h2>
            <p>Use the map to find historically significant neighborhoods and landmarks.</p>
        </div>

        <div class="map-container">
            <button class="toggle-btn" onclick="toggleHeatmap()">Toggle Heatmap</button>
            <div id="map"></div>
        </div>
    </div>

    <script>
        let map = L.map('map').setView([39.7392, -104.9903], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

let heatmapData = [
    // Denver
    [39.7531, -104.9981, 1.5], // LoDo
    [39.7568, -104.9784, 1.4], // Five Points
    [39.7311, -104.9800, 1.3], // Capitol Hill
    [39.7481, -104.9966, 1.6], // Larimer Square
    [39.7527, -104.9990, 1.2], // Union Station
    [39.7191, -104.9881, 1.2], // Baker Historic District
    [39.7643, -105.0035, 1.3], // Highland Neighborhood
    [39.7332, -104.9648, 1.1], // Cheesman Park
    [39.7004, -104.9739, 1.0], // Washington Park
    [39.7321, -104.9168, 1.2], // Montclair Historic District
    [39.7470, -105.0040, 1.5], // Auraria
    [39.6766, -104.9405, 1.3], // Four Mile Historic Park
    [39.7478, -104.9491, 1.2], // City Park & Museum District
    [39.7228, -104.9791, 1.1], // Grant-Humphreys Mansion
    [39.7476, -105.0044, 1.4], // Tivoli Brewing Company
    [40.0200, -105.3069, 1.5], // Boulder Canyon & Switzerland Trail
    [40.0642, -105.4234, 1.4], // Gold Hill
    [39.9848, -105.5370, 1.3], // Caribou Ghost Town
    [39.7524, -105.2226, 1.5], // Colorado School of Mines Geology Museum
    [39.7551, -105.2216, 1.3], // Astor House Museum
    [39.7545, -105.2223, 1.2], // Clear Creek History Park
    [39.7558, -105.2207, 1.1], // Rocky Mountain Quilt Museum
    [39.7514, -105.2260, 1.3], // Golden Cemetery
    [39.6943, -105.1936, 1.5], // Triceratops Trail
    [39.6518, -105.1881, 1.2], // Morrison Coal Mines
    [39.8022, -105.0796, 1.5], // Ralston’s Gold Discovery Site
    [39.7990, -105.0823, 1.3], // Arvada Flour Mill Museum
    [39.6292, -105.3238, 1.4], // Hiwan Homestead Museum (Evergreen)
    [39.6133, -105.0167, 1.3], // Littleton Historic District
    [39.6455, -105.1517, 1.2], // Bear Creek Lake Park
    [39.6226, -105.1953, 1.1], // The Fort (Morrison)
    [39.3722, -104.8594, 1.3], // Castle Rock Historical Society Museum
    [40.0176, -105.2797, 1.5], // Pearl Street Historic District
    [39.9980, -105.2817, 1.4], // Chautauqua Park
    [40.0076, -105.2712, 1.3], // CU Boulder Old Main
    [39.7561, -105.2211, 1.5], // Downtown Golden
    [39.7439, -105.2371, 1.4], // Buffalo Bill’s Grave
    [39.7571, -105.2183, 1.2], // Coors Brewery
    [39.6654, -105.2054, 1.6], // Red Rocks Amphitheater
    [39.6543, -105.1914, 1.3], // Morrison Historic District
    [39.6711, -105.1864, 1.2], // Dinosaur Ridge
    [39.8000, -105.0815, 1.5], // Olde Town Arvada
    [39.7933, -105.1208, 1.3], // Ralston’s Crossing
];


        let heatLayer = L.heatLayer(heatmapData, { 
            radius: 75,
            blur: 25,
            maxZoom: 14,
            maxOpacity: 0.8,
            scaleRadius: false,
            useLocalExtrema: false,
            maxIntensity: 1.3,
            gradient: {
                0.3: "blue",
                0.5: "lime",
                0.7: "yellow",
                1.0: "red"
            }
        });

        let heatmapVisible = false;

        function toggleHeatmap() {
            if (heatmapVisible) {
                map.removeLayer(heatLayer);
            } else {
                heatLayer.addTo(map);
            }
            heatmapVisible = !heatmapVisible;
        }

                // Ensure city selection persists when navigating from index to explore
        window.onload = function() {
            const savedCity = localStorage.getItem("selectedCity");
            if (savedCity) {
                document.getElementById("cityFilter").value = savedCity;
            }
        };
        
        // Save selected city when changed
        function saveSelectedCity() {
            const selectedCity = document.getElementById("cityFilter").value;
            localStorage.setItem("selectedCity", selectedCity);
        }

    </script>
</body>
</html>
