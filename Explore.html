<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore - Traipse</title>
    <!-- Leaflet Library -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Heatmap Plugin -->
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    
    <!-- Heatmap Plugin -->
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== Header ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: #111;
            color: #03FDFC;
            height: 65px;
            width: 100%;
            box-sizing: border-box;
        }

        .website-title {
            font-size: 2em;
            font-weight: 900;
            text-transform: uppercase;
            color: #03FDFC;
            margin-left: 15px;
        }

        .header-buttons-container {
            display: flex;
            justify-content: flex-end;
            flex-grow: 1;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .header-btn {
            background: transparent;
            border: 2px solid #03FDFC;
            color: #03FDFC;
            font-size: 0.8em;
            font-weight: bold;
            padding: 5px 10px;
            min-width: 110px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 5px;
            text-align: center;
        }

        .header-btn:hover {
            background: #03FDFC;
            color: black;
        }

        /* Active Button (Indicates Current Page) */
        .header-btn.active {
            background: #03FDFC;
            color: black;
        }

        /* ===== Map Styling ===== */
        .map-container {
            width: 100vw;
            height: calc(100vh - 65px);
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* ===== Heatmap Toggle Button ===== */
        .toggle-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #03FDFC;
            border: 2px solid black;
            color: black;
            padding: 10px 15px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            box-shadow: 2px 2px 10px rgba(0, 255, 255, 0.3);
            z-index: 1000;
        }

        .toggle-btn:hover {
            background: #02c9c9;
        }

    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="website-title">TRAIPSE - EXPLORE</div>
        <div class="header-buttons-container">
            <div class="header-buttons">
                <button class="header-btn" onclick="window.location.href='index.html'">HOME</button>
                <button class="header-btn" onclick="window.location.href='myPlaces.html'">MY PLACES</button>
                <button class="header-btn active">EXPLORE</button>
                <button class="header-btn">SUBMIT FEEDBACK</button>
                <button class="header-btn">DONATE</button>
            </div>
        </div>
    </div>

    <!-- Map Container -->
    <div class="map-container">
        <button class="toggle-btn" onclick="toggleHeatmap()">Toggle Heatmap</button>
        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    let map = L.map('map').setView([39.7392, -104.9903], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Sample historical sites heatmap data (latitude, longitude, intensity)
    let heatmapData = [
        [39.7392, -104.9903, 0.8],  // Downtown Denver
        [39.7420, -104.9820, 0.7],  // Capitol Hill
        [39.7500, -104.9990, 0.9],  // Union Station
        [39.7600, -105.0050, 0.5]   // Highlands
    ];

    let heatLayer = L.heatLayer(heatmapData, { 
        radius: 25, 
        blur: 15, 
        maxZoom: 17 
    });

    let heatmapVisible = false;

    function toggleHeatmap() {
        if (heatmapVisible) {
            map.removeLayer(heatLayer);
        } else {
            heatLayer.addTo(map);
        }
        heatmapVisible = !heatmapVisible;
    }
</script>

</body>
</html>
