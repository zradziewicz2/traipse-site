<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore - Traipse</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: #111;
            color: #03FDFC;
            height: 65px;
            width: 100%;
            box-sizing: border-box;
        }
        .container {
            display: flex;
            width: 100vw;
            max-width: 100%;
            height: calc(100vh - 100px);
            gap: 20px;
            padding: 10px;
            box-sizing: border-box;
        }
        .explore-section {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #181818;
            border-radius: 10px;
            height: 90%;
            box-sizing: border-box;
        }
        .map-container {
            flex: 2;
            height: 100vh;
            max-height: 650px;
            border-radius: 10px;
            overflow: hidden;
        }
        .filter-bar {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #222;
            border-radius: 10px;
        }
        .filter-btn {
            background: #03FDFC;
            border: none;
            color: black;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            padding: 8px 15px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="website-title">TRAIPSE</div>
        <span class="tagline">Discover new history and culture around you.</span>
        <div class="header-buttons-container">
            <div class="header-buttons">
                <button class="header-btn" onclick="window.location.href='myPlaces.html'">MY PLACES</button>
                <button class="header-btn active">EXPLORE</button>
                <button class="header-btn">SUBMIT FEEDBACK</button>
                <button class="header-btn">DONATE</button>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="explore-section">
            <h2>Explore Historical Sites</h2>
            <div class="filter-bar">
                <button class="filter-btn">Trending</button>
                <button class="filter-btn">Random Site</button>
                <button class="filter-btn">Hidden Gems</button>
                <button class="filter-btn">Time-Lapse History</button>
            </div>
            <div id="explore-list"></div>
        </div>
        <div id="map" class="map-container"></div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        let map = L.map('map').setView([39.7392, -104.9903], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
    </script>
</body>
</html>
