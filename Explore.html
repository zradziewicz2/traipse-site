<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore - Traipse</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: #111;
            color: #03FDFC;
            height: 65px;
            width: 100%;
            box-sizing: border-box;
        }
        .map-container {
            flex: 1;
            height: calc(100vh - 65px);
            width: 100%;
        }
        .toggle-btn {
            position: absolute;
            top: 80px;
            left: 20px;
            background: #03FDFC;
            border: none;
            color: black;
            padding: 10px 15px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            z-index: 1000;
        }
        .toggle-btn:hover {
            background: #02c9c9;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="website-title">TRAIPSE - EXPLORE</div>
    </div>
    <button class="toggle-btn" onclick="toggleHeatmap()">Toggle Heatmap</button>
    <div id="map" class="map-container"></div>
    
    <script>
        let map = L.map('map').setView([39.7392, -104.9903], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        
        let heatmapLayer;
        
        function fetchHistoricalData() {
            const queryUrl = "https://query.wikidata.org/sparql?format=json&query=" + encodeURIComponent(`
                SELECT ?place ?placeLabel ?lat ?lon WHERE {
                    ?place wdt:P31 wd:Q839954;  # Instance of historical site
                           wdt:P625 ?coord.
                    SERVICE wikibase:label { bd:serviceParam wikibase:language "en" }
                    BIND(geof:longitude(?coord) AS ?lon)
                    BIND(geof:latitude(?coord) AS ?lat)
                } LIMIT 200
            `);
            
            fetch(queryUrl)
                .then(response => response.json())
                .then(data => {
                    let heatPoints = [];
                    data.results.bindings.forEach(item => {
                        let lat = parseFloat(item.lat.value);
                        let lon = parseFloat(item.lon.value);
                        heatPoints.push([lat, lon, 0.8]);
                    });
                    heatmapLayer = L.heatLayer(heatPoints, { radius: 25 }).addTo(map);
                })
                .catch(error => console.error("Error fetching historical data:", error));
        }
        
        function toggleHeatmap() {
            if (map.hasLayer(heatmapLayer)) {
                map.removeLayer(heatmapLayer);
            } else {
                fetchHistoricalData();
            }
        }
        
        fetchHistoricalData();
    </script>
</body>
</html>
