<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore - Traipse</title>

    <!-- Leaflet Library -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Heatmap Plugin -->
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: #111;
            color: #03FDFC;
            height: 65px;
            width: 100%;
            box-sizing: border-box;
        }

        .website-title {
            font-size: 2em;
            font-weight: 900;
            text-transform: uppercase;
            color: #03FDFC;
            margin-left: 15px;
        }

        .header-buttons-container {
            display: flex;
            justify-content: flex-end;
            flex-grow: 1;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .header-btn {
            background: transparent;
            border: 2px solid #03FDFC;
            color: #03FDFC;
            font-size: 0.8em;
            font-weight: bold;
            padding: 5px 10px;
            min-width: 110px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 5px;
            text-align: center;
        }

        .header-btn:hover {
            background: #03FDFC;
            color: black;
        }

        .header-btn.active {
            background: #03FDFC;
            color: black;
        }

        .map-container {
            width: 100vw;
            height: calc(100vh - 65px);
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .toggle-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #03FDFC;
            border: 2px solid black;
            color: black;
            padding: 10px 15px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            box-shadow: 2px 2px 10px rgba(0, 255, 255, 0.3);
            z-index: 1000;
        }

        .toggle-btn:hover {
            background: #02c9c9;
        }

    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="website-title">TRAIPSE - EXPLORE</div>
        <div class="header-buttons-container">
            <div class="header-buttons">
                <button class="header-btn" onclick="window.location.href='index.html'">HOME</button>
                <button class="header-btn" onclick="window.location.href='myPlaces.html'">MY PLACES</button>
                <button class="header-btn active">EXPLORE</button>
                <button class="header-btn">SUBMIT FEEDBACK</button>
                <button class="header-btn">DONATE</button>
            </div>
        </div>
    </div>

    <!-- Map Container -->
    <div class="map-container">
        <button class="toggle-btn" onclick="toggleHeatmap()">Toggle Heatmap</button>
        <div id="map"></div>
    </div>

    <script>
        let map = L.map('map').setView([39.7392, -104.9903], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let heatmapData = [
            // Denver
            [39.7480, -104.9991, 0.8],  // Larimer Square
            [39.7527, -104.9990, 0.7],  // Union Station
            [39.7400, -104.9784, 0.8],  // Capitol Hill
            [39.7565, -104.9701, 0.6],  // Five Points

            // Boulder
            [40.0176, -105.2797, 0.9],  // Pearl Street Mall
            [40.0069, -105.2694, 0.8],  // CU Boulder Old Main
            [39.9994, -105.2815, 0.7],  // Mapleton Hill
            [39.9980, -105.2813, 0.6],  // Chautauqua Park

            // Golden
            [39.7555, -105.2211, 0.9],  // Downtown Golden
            [39.7561, -105.2245, 0.8],  // Colorado School of Mines
            [39.7469, -105.2012, 0.7],  // Coors Brewery
            [39.7335, -105.2350, 0.6],  // Buffalo Bill's Grave

            // Morrison
            [39.6553, -105.1911, 0.8],  // Morrison Historic District
            [39.6644, -105.2055, 0.9],  // Dinosaur Ridge
            [39.6650, -105.2050, 0.7],  // Red Rocks Amphitheater

            // Aurora
            [39.7420, -104.8384, 0.7],  // Fitzsimons Army Hospital
            [39.7270, -104.8760, 0.6],  // DeLaney Farm
            [39.7294, -104.8280, 0.5],  // Coal Creek Schoolhouse

            // Lakewood
            [39.7067, -105.0814, 0.8],  // Heritage Lakewood Belmar Park
            [39.6900, -105.1177, 0.7],  // Jewish Consumptive Relief Society

            // Broomfield
            [39.9205, -105.0905, 0.7],  // Broomfield Depot Museum

            // Littleton
            [39.6133, -105.0166, 0.9],  // Littleton Main Street
            [39.6121, -105.0170, 0.8],  // Littleton Museum

            // Arvada
            [39.8006, -105.0817, 0.8],  // Olde Town Arvada
            [39.8023, -105.0833, 0.7],  // Arvada Flour Mill

            // Westminster
            [39.8384, -105.0380, 0.7],  // Westminster Castle

            // Superior
            [39.9528, -105.1686, 0.6],  // Industrial Mine Site
        ];

        let heatLayer = L.heatLayer(heatmapData, { 
            radius: 45, 
            blur: 15, 
            maxZoom: 17,
            maxOpacity: 0.8
        });

        let heatmapVisible = false;

        function toggleHeatmap() {
            if (heatmapVisible) {
                map.removeLayer(heatLayer);
            } else {
                heatLayer.addTo(map);
            }
            heatmapVisible = !heatmapVisible;
        }
    </script>

</body>
</html>
