<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Places - Traipse</title>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
            color: white;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #03FDFC;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        .category {
            margin-bottom: 20px;
            padding: 10px;
            background: #222;
            border-radius: 10px;
        }
        .site-card {
            display: flex;
            align-items: center;
            background: #333;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .site-image {
            width: 80px;
            height: 80px;
            border-radius: 5px;
            margin-right: 15px;
        }
        .site-info {
            flex-grow: 1;
            text-align: left;
        }
        .remove-btn {
            background: none;
            border: 2px solid #ff4444;
            color: #ff4444;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        .remove-btn:hover {
            background: #ff4444;
            color: white;
        }
    </style>
</head>
<body>
    <h1>My Places</h1>
    <div class="container">
        <div class="category" id="favorites">
            <h2>My Favorites</h2>
            <div id="favoritesList"></div>
        </div>
        <div class="category" id="notForMe">
            <h2>Not for Me</h2>
            <div id="notForMeList"></div>
        </div>
    </div>

    <script>
        function loadMyPlaces() {
            let favorites = JSON.parse(localStorage.getItem('myPlaces')) || [];
            let notInterested = JSON.parse(localStorage.getItem('notInterested')) || [];
            
            const renderList = (list, containerId) => {
                let container = document.getElementById(containerId);
                container.innerHTML = '';
                list.forEach(site => {
                    let siteCard = document.createElement('div');
                    siteCard.className = 'site-card';
                    siteCard.innerHTML = `
                        <img src="${site.image}" class="site-image" alt="${site.name}">
                        <div class="site-info">
                            <h3>${site.name}</h3>
                            <p>${site.description}</p>
                        </div>
                        <button class="remove-btn" onclick="removeFromList('${site.id}', '${containerId}')">Remove</button>
                    `;
                    container.appendChild(siteCard);
                });
            };
            
            renderList(favorites, 'favoritesList');
            renderList(notInterested, 'notForMeList');
        }

        function removeFromList(siteId, listType) {
            let listKey = listType === 'favoritesList' ? 'myPlaces' : 'notInterested';
            let list = JSON.parse(localStorage.getItem(listKey)) || [];
            list = list.filter(site => site.id !== siteId);
            localStorage.setItem(listKey, JSON.stringify(list));
            loadMyPlaces();
        }

        window.onload = loadMyPlaces;
    </script>
</body>
</html>
