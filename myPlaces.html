<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Places - Traipse</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            display: flex;
            width: 90%;
            max-width: 1200px;
            margin-top: 20px;
        }
        .favorites-section {
            flex: 1;
            margin-right: 20px;
            overflow-y: auto;
        }
        .map-container {
            width: 50%;
            height: 600px;
            border-radius: 10px;
            overflow: hidden;
        }
        .card {
            background: #222;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            display: flex;
            align-items: center;
        }
        .card img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 5px;
            margin-right: 10px;
        }
        .remove-btn {
            background: red;
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: auto;
        }
        .remove-btn:hover {
            background: darkred;
        }
        .itinerary-btn {
            background: #03FDFC;
            border: none;
            color: black;
            padding: 12px 20px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            display: block;
            text-align: center;
        }
        .itinerary-btn:hover {
            background: #02c9c9;
        }
        .itinerary-output {
            background: #111;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
            width: 80%;
        }
    </style>
</head>
<body>
    <h1>My Places</h1>
    <div class="container">
        <div class="favorites-section">
            <h2>My Favorites</h2>
            <div id="favorites-list"></div>
            <button class="itinerary-btn" onclick="generateItinerary()">Itinerary Generator</button>
            <div id="itinerary-output" class="itinerary-output" style="display: none;"></div>
        </div>
        <div id="map" class="map-container"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        let myPlaces = JSON.parse(localStorage.getItem('myPlaces')) || [];
        let filteredPlaces = myPlaces.filter(site => site.name !== "Dinosaur Ridge" && site.name !== "Test Place");
        localStorage.setItem('myPlaces', JSON.stringify(filteredPlaces));
        
        function displayFavorites() {
            const favoritesList = document.getElementById("favorites-list");
            favoritesList.innerHTML = "";
            filteredPlaces.forEach(site => {
                let card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <img src="${site.image}" alt="${site.name}">
                    <div>
                        <strong>${site.name}</strong>
                        <p>${site.description}</p>
                    </div>
                    <button class="remove-btn" onclick="removeFromFavorites('${site.id}')">Remove</button>
                `;
                favoritesList.appendChild(card);
            });
        }
        
        function removeFromFavorites(siteId) {
            filteredPlaces = filteredPlaces.filter(site => site.id !== siteId);
            localStorage.setItem('myPlaces', JSON.stringify(filteredPlaces));
            displayFavorites();
            updateMap();
        }
        
        let map = L.map('map').setView([39.7392, -104.9903], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        function updateMap() {
            map.eachLayer(layer => {
                if (layer instanceof L.Marker) {
                    map.removeLayer(layer);
                }
            });
            filteredPlaces.forEach(site => {
                L.marker([site.lat, site.lng]).addTo(map).bindPopup(`<b>${site.name}</b><br>${site.description}`);
            });
        }

        function generateItinerary() {
            if (filteredPlaces.length === 0) {
                alert("No places added to generate an itinerary.");
                return;
            }
            let output = document.getElementById("itinerary-output");
            output.style.display = "block";
            output.innerHTML = "<h3>Itinerary</h3>";
            let totalTime = 0;
            let totalCost = 0;
            
            filteredPlaces.forEach((site, index) => {
                let visitTime = site.estimatedTime || "1 hour";
                let cost = site.cost ? `$${site.cost}` : "Free";
                totalCost += site.cost ? parseFloat(site.cost) : 0;
                output.innerHTML += `
                    <p><strong>Stop ${index + 1}: ${site.name}</strong><br>
                    Estimated Visit Time: ${visitTime}<br>
                    Cost: ${cost}</p>
                `;
            });
            output.innerHTML += `<p><strong>Total Estimated Cost:</strong> $${totalCost.toFixed(2)}</p>`;
        }
        
        displayFavorites();
        updateMap();
    </script>
</body>
</html>
