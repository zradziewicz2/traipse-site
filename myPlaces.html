<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Places - Traipse</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== Header Styles ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: #111;
            color: #03FDFC;
            height: 65px;
            width: 100%;
            box-sizing: border-box;
        }

        #logo {
            width: auto;
            height: 50px;
            object-fit: contain;
            margin-left: 10px;
        }

        .website-title {
            font-size: 2em;
            font-weight: 900;
            text-transform: uppercase;
            color: #03FDFC;
            white-space: nowrap;
            margin-left: 15px;
        }

        .tagline {
            font-size: 1em;
            font-family: 'Georgia', serif;
            color: #03FDFC;
            white-space: nowrap;
        }

        .header-buttons-container {
            display: flex;
            justify-content: flex-end;
            flex-grow: 1;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .header-btn {
            background: transparent;
            border: 2px solid #03FDFC;
            color: #03FDFC;
            font-size: 0.8em;
            font-weight: bold;
            padding: 5px 10px;
            min-width: 110px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 5px;
            text-align: center;
        }

        .header-btn:hover {
            background: #03FDFC;
            color: black;
        }

        /* ===== Page Layout ===== */
        .container {
            display: flex;
            width: 95%;
            max-width: 1600px;
            height: calc(100vh - 100px);
            gap: 20px;
            margin: 10px auto;
            padding: 10px;
            box-sizing: border-box;
        }

        /* ===== My Favorites List ===== */
        .favorites-section {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #181818;
            border-radius: 10px;
            height: 85%;
            box-sizing: border-box;
        }

        .favorites-section h2 {
            margin-top: 0;
        }

        /* ===== Itinerary Generator Button (Now Below the List) ===== */
        .itinerary-btn-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
            padding: 10px;
            width: 100%;
        }

        .itinerary-btn {
            background: #03FDFC;
            border: none;
            color: black;
            padding: 12px 20px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            width: 300px;
        }

        .itinerary-btn:hover {
            background: #02c9c9;
        }

        /* ===== Map Container ===== */
        .map-container {
            flex: 1;
            height: 100%;
            border-radius: 10px;
            overflow: hidden;
        }

        /* ===== Cards ===== */
        .card {
            background: #222;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            box-shadow: 2px 2px 10px rgba(0, 255, 255, 0.2);
            width: 100%;
        }

        .card img {
            width: 120px;
            height: 90px;
            object-fit: cover;
            border-radius: 5px;
            margin-right: 15px;
        }

        .card-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #03FDFC;
            margin-bottom: 5px;
        }

        .remove-btn {
            background: red;
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .remove-btn:hover {
            background: darkred;
        }
        .itinerary-btn-container {
            display: flex;
            justify-content: center;
            margin-top: 15px;
            padding: 10px;
        }
        
        .itinerary-btn {
            background: #03FDFC;
            border: none;
            color: black;
            padding: 12px 20px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 300px;
            text-align: center;
        }
        
        .itinerary-btn:hover {
            background: #02c9c9;
        }


    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header">
        <img id="logo" src="traipse_logo_turquoise2.png" alt="Traipse Logo">
        <div class="website-title">TRAIPSE</div>
        <span class="tagline">Step into the past—explore history, culture, and hidden gems near you.</span>

        <div class="header-buttons-container">
            <div class="header-buttons">
                <button class="header-btn">CONNECT</button>
                <button class="header-btn" onclick="window.location.href='myPlaces.html'">MY PLACES</button>
                <button class="header-btn">SUBMIT FEEDBACK</button>
                <button class="header-btn">DONATE</button>
            </div>
        </div>
    </div>

    <!-- My Places Section -->
    <h1 style="margin: 20px 0 10px 20px;">My Places</h1>

        <div class="container">
            <div class="favorites-section">
                <h2>My Favorites</h2>
                <div id="favorites-list"></div>
                
                <!-- Itinerary Button Added Here -->
            </div>
        
            <div id="map" class="map-container"></div>
        </div>
        <div class="itinerary-btn-container">
        <button class="itinerary-btn" onclick="generateItinerary()">Itinerary Generator</button>
    </div>

    <!-- Itinerary Generator Button (Placed Below the List) -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        let myPlaces = JSON.parse(localStorage.getItem('myPlaces')) || [];

        function displayFavorites() {
            const favoritesList = document.getElementById("favorites-list");
            favoritesList.innerHTML = "";
            myPlaces.forEach(site => {
                let card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <img src="${site.image}" alt="${site.name}">
                    <div>
                        <strong class="card-title">${site.name}</strong>
                        <p>${site.description}</p>
                        <p><strong>Cost:</strong> ${site.cost}</p>
                    </div>
                    <button class="remove-btn" onclick="removeFromFavorites('${site.id}')">Remove</button>
                `;
                favoritesList.appendChild(card);
            });
        }

        function removeFromFavorites(siteId) {
            myPlaces = myPlaces.filter(site => site.id !== siteId);
            localStorage.setItem('myPlaces', JSON.stringify(myPlaces));
            displayFavorites();
            updateMap();
        }

        let map = L.map('map').setView([39.7392, -104.9903], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        function updateMap() {
            myPlaces.forEach(site => {
                L.marker([site.lat, site.lng]).addTo(map).bindPopup(`<b>${site.name}</b><br>${site.description}`);
            });
        }

        displayFavorites();
        updateMap();
    function generateItinerary() {
        if (myPlaces.length < 2) {
            alert("At least two locations are required for an itinerary.");
            return;
        }

        let sortedPlaces = [...myPlaces].sort((a, b) => a.lat - b.lat);

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        let img = new Image();
        img.src = "traipse_logo_turquoise2.png"; 
        doc.addImage(img, "PNG", 10, 10, 30, 30); 

        doc.setFont("times", "bold");
        doc.setFontSize(22);
        doc.text("Itinerary", 50, 25);

        doc.setFont("times", "italic");
        doc.setFontSize(14);
        doc.text("Happy Traipsing!", 50, 35);

        let y = 50;
        let totalTravelTime = 0;

        sortedPlaces.forEach((site, index) => {
            doc.setFont("times", "bold");
            doc.setFontSize(14);
            doc.text(`${index + 1}. ${site.name}`, 20, y);

            doc.setFont("times", "normal");
            doc.setFontSize(12);
            doc.text(`Estimated Visit Time: ${site.estimatedTime || 'Unknown'}`, 20, y + 10);
            doc.text(`Cost: ${site.cost || 'Free'}`, 20, y + 20);

            if (index < sortedPlaces.length - 1) {
                let distance = estimateDistance(site, sortedPlaces[index + 1]);
                let travelTime = estimateTravelTime(distance);
                totalTravelTime += travelTime;

                doc.text(`Drive: ~${distance.toFixed(1)} miles (~${travelTime} min)`, 20, y + 30);
                y += 45;
            } else {
                y += 30;
            }
        });

        doc.setFontSize(14);
        doc.text(`Total Estimated Travel Time: ~${totalTravelTime} min`, 20, y + 15);
        doc.save("itinerary.pdf");
    }

    function estimateDistance(siteA, siteB) {
        const R = 3958.8;
        const toRad = angle => angle * (Math.PI / 180);
        let dLat = toRad(siteB.lat - siteA.lat);
        let dLon = toRad(siteB.lng - siteA.lng);
        let a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRad(siteA.lat)) * Math.cos(toRad(siteB.lat)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
        let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
    }

    function estimateTravelTime(distance) {
        return Math.round(distance * 1.5);
    }

    </script>
</body>
</html>
