<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Places - Traipse</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>



    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== Header Styles ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: #111;
            color: #03FDFC;
            height: 65px;
            width: 100%;
            box-sizing: border-box;
        }

        #logo {
            width: auto;
            height: 50px;
            object-fit: contain;
            margin-left: 10px;
        }
                .favorites-header {
            display: flex;
            justify-content: space-between; /* Pushes title left, button right */
            align-items: center;
            padding: 10px 15px;
            background: #181818; /* Matches card background */
            border-radius: 10px 10px 0 0;
        }
        
        .favorites-header h2 {
            margin: 0;
            color: white;
        }

        .website-title {
            font-size: 2em;
            font-weight: 900;
            text-transform: uppercase;
            color: #03FDFC;
            white-space: nowrap;
            margin-left: 15px;
        }

        .tagline {
            font-size: 1em;
            font-family: 'Georgia', serif;
            color: #03FDFC;
            white-space: nowrap;
        }

        .header-buttons-container {
            display: flex;
            justify-content: flex-end;
            flex-grow: 1;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .header-btn {
            background: transparent;
            border: 2px solid #03FDFC;
            color: #03FDFC;
            font-size: 0.8em;
            font-weight: bold;
            padding: 5px 10px;
            min-width: 110px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 5px;
            text-align: center;
        }

        .header-btn:hover {
            background: #03FDFC;
            color: black;
        }

        /* ===== Page Layout ===== */
        .container {
            display: flex;
            width: 98%;
            max-width: 1600px;
            height: calc(100vh - 100px); /* Adjusted to fill space better */
            gap: 20px;
            margin: 0 auto; /* Centering */
            padding: 0; /* Remove unnecessary padding */
            box-sizing: border-box;
        }

        .card-title {
            font-size: 1.8em; /* Bigger Title */
            font-weight: bold;
            color: #03FDFC; /* Cyan Blue */
            margin-bottom: 5px;
        }


        /* ===== My Favorites List ===== */
        .favorites-section {
            flex: 1.2; /* Increased flex to expand leftward */
            overflow-y: auto;
            padding: 20px;
            background: #181818;
            border-radius: 10px;
            height: 90%; /* Increased height */
            box-sizing: border-box;
        }

        .favorites-section h2 {
            margin-top: 0;
            margin-bottom: 10px; /* Add space below the title */
        }

        /* ===== Itinerary Generator Button (Now Below the List) ===== */
        .itinerary-btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: -20px; /* Moves it up */
            padding: 10px;
            width: 100%;
            position: relative;
        }


        
         .itinerary-btn {
            background: #03FDFC;
            position: absolute;
            border: none;
            color: black;
            font-weight: bold;
            border-radius: 6px; /* Slightly rounded corners */
            cursor: pointer;
            text-align: center;
            width: 180px; /* Reduce width */
            height: 40px; /* Adjust height */
            top: 10px;  /* Aligns it with My Favorites */
            right: 15px;  /* Moves it to the right */
            padding: 6px 10px;  /* Smaller padding */
            font-size: 0.9em;  /* Reduce text size */
        }




        .itinerary-btn:hover {
            background: #02c9c9;
        }

        /* ===== Map Container ===== */
        .map-container {
            flex: 1.8; /* Expands the map width further to the right */
            height: 100vh; /* Reduces height to prevent it from going too far down */
            max-height: 650px; /* Ensures it doesn’t get too tall */
            border-radius: 10px;
            overflow: hidden;
        }


        /* ===== Cards ===== */
        .card {
            background: #222;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            display: flex;
            align-items: flex-start;
            box-shadow: 2px 2px 10px rgba(0, 255, 255, 0.2);
            width: 100%;
            font-size: 1.1em; /* Slightly larger text */
        }

        .card img {
            width: 200px;  /* Adjust width */
            height: 150px; /* Adjust height */
            object-fit: cover;
            border-radius: 5px;
            margin-right: 20px;
        }


        .remove-btn {
            background: red;
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .remove-btn:hover {
            background: darkred;
        }
        .itinerary-btn-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            padding: 10px;
            width: 100%;
        }
        
        .itinerary-btn:hover {
            background: #02c9c9;
        }
        
        .notes-input {
            width: 100%;
            background: #333;
            border: 1px solid #03FDFC;
            color: white;
            padding: 5px;
            border-radius: 5px;
            margin-top: 5px;
            font-size: 1em;
            resize: vertical;
        }



    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header">
        <img id="logo" src="traipse_logo_turquoise2.png" alt="Traipse Logo">
        <div class="website-title">TRAIPSE</div>
        <span class="tagline">Step into the past—explore history, culture, and hidden gems near you.</span>

        <div class="header-buttons-container">
            <div class="header-buttons">
                <button class="header-btn">CONNECT</button>
                <button class="header-btn" onclick="window.location.href='myPlaces.html'">MY PLACES</button>
                <button class="header-btn">SUBMIT FEEDBACK</button>
                <button class="header-btn">DONATE</button>
            </div>
        </div>
    </div>

    <!-- My Places Section -->

        <div class="container">
            <div class="favorites-section">
        <div class="favorites-header">
            <h2>My Favorites</h2>
            <button class="itinerary-btn" onclick="generateItinerary()">Itinerary Generator</button>
        </div>

                <div id="favorites-list"></div>
            </div>
        
            <div id="map" class="map-container"></div>
        </div>

    <!-- Itinerary Generator Button (Placed Below the List) -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        let myPlaces = JSON.parse(localStorage.getItem('myPlaces')) || [];

        function displayFavorites() {
            const favoritesList = document.getElementById("favorites-list");
            favoritesList.innerHTML = "";
            myPlaces.forEach(site => {
                let card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <img src="${site.image}" alt="${site.name}">
                    <div>
                        <strong class="card-title">${site.name}</strong>
                        <p>${site.description}</p>
                        <p><strong>Cost:</strong> ${site.cost || 'Free'}</p>
                        <textarea id="notes-${site.id}" class="notes-input" rows="2" placeholder="Add your notes here...">${site.notes || ''}</textarea>
                    </div>
                    <button class="remove-btn" onclick="removeFromFavorites('${site.id}')">Remove</button>
                `;
                favoritesList.appendChild(card);
                
                // Save notes to localStorage when user types
                document.getElementById(`notes-${site.id}`).addEventListener("input", function() {
                    site.notes = this.value;
                    localStorage.setItem('myPlaces', JSON.stringify(myPlaces));
                });
            });
        }
        

        function removeFromFavorites(siteId) {
            myPlaces = myPlaces.filter(site => site.id !== siteId);
            localStorage.setItem('myPlaces', JSON.stringify(myPlaces));
            displayFavorites();
            updateMap();
        }

        let map = L.map('map').setView([39.7392, -104.9903], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        function updateMap() {
            myPlaces.forEach(site => {
                L.marker([site.lat, site.lng]).addTo(map).bindPopup(`<b>${site.name}</b><br>${site.description}`);
            });
        }

        displayFavorites();
        updateMap();

        let sortedPlaces = [...myPlaces].sort((a, b) => a.lat - b.lat);
        function generateItinerary() {
            if (typeof window.jspdf === "undefined") {
                alert("Error: jsPDF library not loaded.");
                return;
            }
        
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
        
            if (myPlaces.length < 2) {
                alert("At least two locations are required for an itinerary.");
                return;
            }
        
            let sortedPlaces = [...myPlaces].sort((a, b) => a.lat - b.lat);
        
            // ** Adjusted Logo Position & Size **
            let img = new Image();
            img.src = "traipse_logo_turquoise2.png";
            doc.addImage(img, "PNG", 195, 5, 8, 12); // **Further right & taller**
        
            // ** Move "TRAIPSE" further left & match color **
            doc.setFont("helvetica", "bold");
            doc.setTextColor(3, 253, 252); // **Same turquoise color**
            doc.setFontSize(20);
            doc.text("TRAIPSE", 160, 14); // **Moved further left from the logo**
        
            // ** Title & Subtitle **
            doc.setFont("helvetica", "bold");
            doc.setFontSize(22);
            doc.setTextColor(0, 0, 0); // **Black for title text**
            doc.text("Itinerary", 15, 20); // Left-aligned title
        
            doc.setFont("helvetica", "italic");
            doc.setFontSize(12);
            doc.text("Happy Traipsing!", 15, 28);
        
            let y = 40; // **Start Y Position**
            let totalTravelTime = 0;
        
            sortedPlaces.forEach((site, index) => {
                doc.setFont("helvetica", "bold");
                doc.setFontSize(14);
                doc.text(`${index + 1}. ${site.name}`, 15, y);
        
                doc.setFont("helvetica", "normal");
                doc.setFontSize(11);
                y += 6;  // **Less space between lines**
        
                doc.text(`Estimated Visit Time: ${site.estimatedTime || 'Unknown'}`, 20, y);
                y += 5;
        
                doc.text(`Cost: ${site.cost || 'Free'}`, 20, y);
                y += 5;
        
                if (index < sortedPlaces.length - 1) {
                    let distance = estimateDistance(site, sortedPlaces[index + 1]);
                    let travelTime = estimateTravelTime(distance);
                    totalTravelTime += travelTime;
        
                    doc.setFont("helvetica", "italic");
                    doc.text(`Drive: ~${distance.toFixed(1)} miles (~${travelTime} min)`, 20, y);
                    y += 8; // **Smaller gap between locations**
                } else {
                    y += 6;
                }
            });
        
            // **Total Travel Time**
            doc.setFont("helvetica", "bold");
            doc.setFontSize(12);
            doc.text(`Total Estimated Travel Time: ~${totalTravelTime} min`, 15, y + 5);
        
            doc.save("itinerary.pdf");
        }


        



    function estimateDistance(siteA, siteB) {
        const R = 3958.8;
        const toRad = angle => angle * (Math.PI / 180);
        let dLat = toRad(siteB.lat - siteA.lat);
        let dLon = toRad(siteB.lng - siteA.lng);
        let a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRad(siteA.lat)) * Math.cos(toRad(siteB.lat)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
        let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
    }

    function estimateTravelTime(distance) {
        return Math.round(distance * 1.5);
    }

    </script>
</body>
</html>
