<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Places - Traipse</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        /* ===== Header Styles ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: #111;
            color: #03FDFC;
            height: 65px;
            width: 100%;
        }

        #logo {
            width: auto;
            height: 50px;
            object-fit: contain;
            margin-left: 10px;
        }

        .website-title {
            font-size: 2em;
            font-weight: 900;
            text-transform: uppercase;
            color: #03FDFC;
            white-space: nowrap;
            margin-left: 15px;
        }

        .tagline {
            font-size: 1em;
            font-family: 'Georgia', serif;
            color: #03FDFC;
            white-space: nowrap;
            flex-grow: 0;
        }

        .header-buttons-container {
            display: flex;
            justify-content: flex-end;
            flex-grow: 1;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .header-btn {
            background: transparent;
            border: 2px solid #03FDFC;
            color: #03FDFC;
            font-size: 0.8em;
            font-weight: bold;
            padding: 5px 10px;
            min-width: 110px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 5px;
            text-align: center;
        }

        .header-btn:hover {
            background: #03FDFC;
            color: black;
        }

        /* ===== Main Page Styles ===== */
        .container {
            display: flex;
            width: 95%;
            max-width: 1400px;
            height: 85vh;
        }

        .favorites-section {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #181818;
            border-radius: 10px;
        }

        .map-container {
            flex: 2;
            height: 100%;
            border-radius: 10px;
            overflow: hidden;
        }

        .card {
            background: #222;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            box-shadow: 2px 2px 10px rgba(0, 255, 255, 0.2);
        }

        .card img {
            width: 120px;
            height: 100px;
            object-fit: cover;
            border-radius: 5px;
            margin-right: 15px;
        }

        .card-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #03FDFC;
            margin-bottom: 5px;
        }

        .remove-btn {
            background: red;
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .remove-btn:hover {
            background: darkred;
        }

        .itinerary-btn {
            background: #03FDFC;
            border: none;
            color: black;
            padding: 12px 20px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            margin-top: 15px;
        }

        .itinerary-btn:hover {
            background: #02c9c9;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header">
        <img id="logo" src="traipse_logo_turquoise2.png" alt="Traipse Logo">
        <div class="website-title">TRAIPSE</div>
        <span class="tagline">Step into the past—explore history, culture, and hidden gems near you.</span>

        <div class="header-buttons-container">
            <div class="header-buttons">
                <button class="header-btn">CONNECT</button>
                <button class="header-btn" onclick="window.location.href='myPlaces.html'">MY PLACES</button>
                <button class="header-btn">SUBMIT FEEDBACK</button>
                <button class="header-btn">DONATE</button>
            </div>
        </div>
    </div>

    <!-- My Places Section -->
    <h1>My Places</h1>
    <div class="container">
        <div class="favorites-section">
            <h2>My Favorites</h2>
            <div id="favorites-list"></div>
            <button class="itinerary-btn" onclick="generateItinerary()">Itinerary Generator</button>
        </div>
        <div id="map" class="map-container"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        let myPlaces = JSON.parse(localStorage.getItem('myPlaces')) || [];

        function displayFavorites() {
            const favoritesList = document.getElementById("favorites-list");
            favoritesList.innerHTML = "";
            myPlaces.forEach(site => {
                let card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <img src="${site.image}" alt="${site.name}">
                    <div>
                        <strong class="card-title">${site.name}</strong>
                        <p>${site.description}</p>
                        <p><strong>Cost:</strong> ${site.cost}</p>
                    </div>
                    <button class="remove-btn" onclick="removeFromFavorites('${site.id}')">Remove</button>
                `;
                favoritesList.appendChild(card);
            });
        }

        function removeFromFavorites(siteId) {
            myPlaces = myPlaces.filter(site => site.id !== siteId);
            localStorage.setItem('myPlaces', JSON.stringify(myPlaces));
            displayFavorites();
            updateMap();
        }

        let map = L.map('map').setView([39.7392, -104.9903], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        function updateMap() {
            map.eachLayer(layer => {
                if (layer instanceof L.Marker) {
                    map.removeLayer(layer);
                }
            });
            myPlaces.forEach(site => {
                L.marker([site.lat, site.lng]).addTo(map).bindPopup(`<b>${site.name}</b><br>${site.description}`);
            });
        }

        displayFavorites();
        updateMap();
    </script>
</body>
</html>
