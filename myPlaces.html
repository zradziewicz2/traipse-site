<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Places - Traipse</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            display: flex;
            width: 90%;
            max-width: 1200px;
            margin-top: 20px;
        }
        .favorites-section {
            flex: 1;
            margin-right: 20px;
            height: 600px;
            overflow-y: auto;
            padding-right: 10px;
        }
        .map-container {
            width: 60%;
            height: 700px;
            border-radius: 10px;
            overflow: hidden;
        }
        .card {
            background: #222;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            display: flex;
            align-items: center;
        }
        .card img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 5px;
            margin-right: 10px;
        }
        .remove-btn {
            background: red;
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: auto;
        }
        .remove-btn:hover {
            background: darkred;
        }
        .itinerary-btn {
            background: #03FDFC;
            border: none;
            color: black;
            padding: 12px 20px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: block;
            text-align: center;
            margin-top: 15px;
        }
        .itinerary-btn:hover {
            background: #02c9c9;
        }
    </style>
</head>
<body>
    <h1>My Places</h1>
    <div class="container">
        <div class="favorites-section">
            <h2>My Favorites</h2>
            <div id="favorites-list"></div>
            <button class="itinerary-btn" onclick="generatePDF()">Itinerary Generator</button>
        </div>
        <div id="map" class="map-container"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        let myPlaces = JSON.parse(localStorage.getItem('myPlaces')) || [];
        let filteredPlaces = myPlaces.filter(site => site.name !== "Dinosaur Ridge" && site.name !== "Test Place");
        localStorage.setItem('myPlaces', JSON.stringify(filteredPlaces));
        
        function displayFavorites() {
            const favoritesList = document.getElementById("favorites-list");
            favoritesList.innerHTML = "";
            filteredPlaces.forEach(site => {
                let card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <img src="${site.image}" alt="${site.name}">
                    <div>
                        <strong>${site.name}</strong>
                        <p>${site.description}</p>
                        <p><strong>Cost:</strong> ${site.cost}</p>
                    </div>
                    <button class="remove-btn" onclick="removeFromFavorites('${site.id}')">Remove</button>
                `;
                favoritesList.appendChild(card);
            });
        }
        
        function removeFromFavorites(siteId) {
            filteredPlaces = filteredPlaces.filter(site => site.id !== siteId);
            localStorage.setItem('myPlaces', JSON.stringify(filteredPlaces));
            displayFavorites();
            updateMap();
        }
        
        let map = L.map('map').setView([39.7392, -104.9903], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        function updateMap() {
            map.eachLayer(layer => {
                if (layer instanceof L.Marker) {
                    map.removeLayer(layer);
                }
            });
            filteredPlaces.forEach(site => {
                L.marker([site.lat, site.lng]).addTo(map).bindPopup(`<b>${site.name}</b><br>${site.description}`);
            });
        }

        function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFont("helvetica");
            doc.setFontSize(16);
            doc.text("Itinerary", 20, 20);
            
            let y = 40;
            filteredPlaces.forEach((site, index) => {
                doc.setFontSize(14);
                doc.text(`${index + 1}. ${site.name}`, 20, y);
                doc.setFontSize(12);
                doc.text(`Description: ${site.description}`, 20, y + 10);
                doc.text(`Estimated Visit Time: ${site.estimatedTime || 'Unknown'}`, 20, y + 20);
                doc.text(`Cost: ${site.cost || 'Free'}`, 20, y + 30);
                y += 50;
            });
            
            doc.save("itinerary.pdf");
        }
        
        displayFavorites();
        updateMap();
    </script>
</body>
</html>
