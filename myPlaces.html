<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Places - Traipse</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        .container {
            display: flex;
            width: 95%;
            max-width: 1400px;
            height: 85vh;
        }

        .favorites-section {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #181818;
            border-radius: 10px;
        }

        .map-container {
            flex: 2;
            height: 100%;
            border-radius: 10px;
            overflow: hidden;
        }

        .card {
            background: #222;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 5px;
        }

        .remove-btn {
            background: red;
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .remove-btn:hover {
            background: darkred;
        }

        .itinerary-btn {
            background: #03FDFC;
            border: none;
            color: black;
            padding: 12px 20px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            margin-top: 15px;
        }

        .itinerary-btn:hover {
            background: #02c9c9;
        }
    </style>
</head>
<body>
    <h1>My Places</h1>
    <div class="container">
        <div class="favorites-section">
            <h2>My Favorites</h2>
            <div id="favorites-list"></div>
            <button class="itinerary-btn" onclick="generateItinerary()">Itinerary Generator</button>
        </div>
        <div id="map" class="map-container"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        let myPlaces = JSON.parse(localStorage.getItem('myPlaces')) || [];
        let filteredPlaces = myPlaces.filter(site => site.name !== "Dinosaur Ridge" && site.name !== "Test Place");
        localStorage.setItem('myPlaces', JSON.stringify(filteredPlaces));

        function displayFavorites() {
            const favoritesList = document.getElementById("favorites-list");
            favoritesList.innerHTML = "";
            filteredPlaces.forEach(site => {
                let card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <img src="${site.image}" alt="${site.name}">
                    <div>
                        <strong>${site.name}</strong>
                        <p>${site.description}</p>
                        <p><strong>Cost:</strong> ${site.cost}</p>
                    </div>
                    <button class="remove-btn" onclick="removeFromFavorites('${site.id}')">Remove</button>
                `;
                favoritesList.appendChild(card);
            });
        }

        function removeFromFavorites(siteId) {
            filteredPlaces = filteredPlaces.filter(site => site.id !== siteId);
            localStorage.setItem('myPlaces', JSON.stringify(filteredPlaces));
            displayFavorites();
            updateMap();
        }

        let map = L.map('map').setView([39.7392, -104.9903], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        function updateMap() {
            map.eachLayer(layer => {
                if (layer instanceof L.Marker) {
                    map.removeLayer(layer);
                }
            });
            filteredPlaces.forEach(site => {
                L.marker([site.lat, site.lng]).addTo(map).bindPopup(`<b>${site.name}</b><br>${site.description}`);
            });
        }

        function generateItinerary() {
            if (filteredPlaces.length < 2) {
                alert("At least two locations are required for an itinerary.");
                return;
            }

            let sortedPlaces = [...filteredPlaces].sort((a, b) => a.lat - b.lat);

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            let img = new Image();
            img.src = "traipse_logo_turquoise2.png"; 
            doc.addImage(img, "PNG", 10, 10, 30, 30); 

            doc.setFont("times", "bold");
            doc.setFontSize(22);
            doc.text("Itinerary", 50, 25);

            doc.setFont("times", "italic");
            doc.setFontSize(14);
            doc.text("Happy Traipsing!", 50, 35);

            let y = 50;
            let totalTravelTime = 0;

            sortedPlaces.forEach((site, index) => {
                doc.setFont("times", "bold");
                doc.setFontSize(14);
                doc.text(`${index + 1}. ${site.name}`, 20, y);

                doc.setFont("times", "normal");
                doc.setFontSize(12);
                doc.text(`Estimated Visit Time: ${site.estimatedTime || 'Unknown'}`, 20, y + 10);
                doc.text(`Cost: ${site.cost || 'Free'}`, 20, y + 20);

                if (index < sortedPlaces.length - 1) {
                    let distance = estimateDistance(site, sortedPlaces[index + 1]);
                    let travelTime = estimateTravelTime(distance);
                    totalTravelTime += travelTime;

                    doc.text(`Drive: ~${distance.toFixed(1)} miles (~${travelTime} min)`, 20, y + 30);
                    y += 45;
                } else {
                    y += 30;
                }
            });

            doc.setFontSize(14);
            doc.text(`Total Estimated Travel Time: ~${totalTravelTime} min`, 20, y + 15);
            doc.save("itinerary.pdf");
        }

        function estimateDistance(siteA, siteB) {
            const R = 3958.8;
            const toRad = angle => angle * (Math.PI / 180);
            let dLat = toRad(siteB.lat - siteA.lat);
            let dLon = toRad(siteB.lng - siteA.lng);
            let a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(toRad(siteA.lat)) * Math.cos(toRad(siteB.lat)) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
            let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function estimateTravelTime(distance) {
            return Math.round(distance * 1.5);
        }

        displayFavorites();
        updateMap();
    </script>
</body>
</html>
